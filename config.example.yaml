# ~/.claude-hybrid/config.yaml — usually edited in the web panel.
version: 2

server:
  proxy_listen: 127.0.0.1:3457   # Claude Code's ANTHROPIC_BASE_URL
  panel_listen: 127.0.0.1:3458   # web panel
  panel_token: ""                # required if the panel listens beyond localhost
  upstream: https://api.anthropic.com
  header_timeout: 300            # seconds to wait for a provider's first byte
  agents_dir: ~/.claude/agents   # written as an absolute path by default
  log_file: ~/.claude-hybrid/proxy.log

providers:
  - id: openrouter
    name: OpenRouter
    type: openai                 # openai = translated, anthropic = passed through
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY   # or api_key: sk-...
    models: [deepseek/deepseek-chat-v3.1, qwen/qwen3-coder]
    enabled: true

  - id: openai
    type: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    max_tokens_field: max_completion_tokens
    models: [gpt-5]
    enabled: true

  - id: zai
    name: Z.ai GLM
    type: anthropic
    base_url: https://api.z.ai/api/anthropic
    api_key_env: ZAI_API_KEY
    models: [glm-4.6]
    enabled: true

  - id: ollama
    type: openai
    base_url: http://127.0.0.1:11434/v1
    models: [qwen3-coder:30b]
    enabled: true

# Subagent name -> route. The agent file needs the marker line
# <!-- claude-hybrid:agent=NAME --> (the panel adds it on save).
agents:
  code-reviewer:
    provider: openai
    model: gpt-5
    reasoning_effort: high
  doc-writer:
    provider: zai
    model: glm-4.6
    max_tokens: 16000
    system_mode: append          # keep | append | replace
    system_prompt: Write in plain, short sentences.

# For requests not from a routed agent; matched on the request's model.
# First enabled match wins. No match = Anthropic subscription.
rules:
  - match: claude-haiku-*
    enabled: true
    note: background jobs (titles, summaries)
    route:
      provider: ollama
      model: qwen3-coder:30b
