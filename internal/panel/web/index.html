<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-hybrid</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--panel2:#f1f3f6;--fg:#1b1f24;--muted:#69717d;--line:#dfe3e8;
  --accent:#c2652a;--accent-fg:#fff;--accent-soft:#f8e9df;
  --ok:#1f8a4c;--ok-soft:#e1f4e8;--warn:#a66a00;--warn-soft:#fbf0d9;--err:#c4322b;--err-soft:#fbe4e2;
  --info:#2f63c4;--info-soft:#e3ebfa;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --r:10px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121417;--panel:#1a1d21;--panel2:#22262b;--fg:#e6e8eb;--muted:#959ca6;--line:#2e3339;
    --accent:#e08249;--accent-fg:#1a1208;--accent-soft:#3a2618;
    --ok:#4cc27c;--ok-soft:#173323;--warn:#e0a83a;--warn-soft:#3a2c12;--err:#ef6b63;--err-soft:#3d1a18;
    --info:#7aa5f0;--info-soft:#1a2740;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121417;--panel:#1a1d21;--panel2:#22262b;--fg:#e6e8eb;--muted:#959ca6;--line:#2e3339;
  --accent:#e08249;--accent-fg:#1a1208;--accent-soft:#3a2618;
  --ok:#4cc27c;--ok-soft:#173323;--warn:#e0a83a;--warn-soft:#3a2c12;--err:#ef6b63;--err-soft:#3d1a18;
  --info:#7aa5f0;--info-soft:#1a2740;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;min-height:100vh}
a{color:var(--accent)}
code,pre,.mono{font-family:var(--mono);font-size:12.5px}
code{background:var(--panel2);padding:1px 5px;border-radius:5px}
h2{font-size:18px;margin:0}h3{font-size:16px;margin:0}h4{font-size:13px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand b{font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.on{background:var(--ok)}.dot.off{background:var(--err)}
nav#tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav#tabs::-webkit-scrollbar{display:none}
nav#tabs a{padding:6px 10px;border-radius:7px;color:var(--muted);text-decoration:none;white-space:nowrap;font-weight:500}
nav#tabs a:hover{background:var(--panel2);color:var(--fg)}
nav#tabs a.active{background:var(--accent-soft);color:var(--accent)}
.actions{display:flex;gap:4px}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.grow{flex:1}
.muted{color:var(--muted)}.small{font-size:12px}
.hint{color:var(--muted);margin:0 0 14px;font-size:13px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{background:var(--panel2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--err);border-color:var(--err-soft)}
.btn.danger:hover{background:var(--err-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.icon{padding:5px 8px;min-width:30px}
.btn.sm{padding:3px 8px;font-size:12px}
input,select,textarea{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;width:100%;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
input:disabled{background:var(--panel2);color:var(--muted)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f>span{font-weight:600;font-size:12.5px}
.f small,.f .sub{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.stat .k{color:var(--muted);font-size:12px}
.stat .v{font-size:22px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.stat.err .v{color:var(--err)}.stat.routed .v{color:var(--accent)}
.cmd{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:8px;padding:8px 10px;margin:8px 0}
.cmd code{background:none;font-size:14px;flex:1;overflow-x:auto;white-space:nowrap}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--panel2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
td.errc{white-space:normal;max-width:320px;color:var(--err);cursor:pointer}
td.errc .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.errc.open .t{white-space:pre-wrap;word-break:break-word}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.badge.routed{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.badge.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--accent)}
.card .title{display:flex;align-items:center;gap:8px;font-weight:650;margin-bottom:4px;word-break:break-all}
.card .desc{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px;white-space:pre-line}
.card .meta{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.loading{padding:30px;color:var(--muted);text-align:center}
.errbox{padding:14px;border-radius:var(--r);background:var(--err-soft);color:var(--err)}
.note{padding:10px 12px;border-radius:8px;background:var(--info-soft);color:var(--info);font-size:13px;margin-bottom:12px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.calib{display:flex;align-items:center;gap:10px;margin-top:8px}
.calib-bar{flex:0 0 160px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.calib-bar>span{display:block;height:100%;background:var(--accent)}
.switch{position:relative;display:inline-block;width:34px;height:20px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:20px;cursor:pointer;transition:.15s}
.switch span:before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span:before{transform:translateX(14px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-family:var(--mono);font-size:12px}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 4px;border-radius:50%}
.chip button:hover{color:var(--err)}
.row{display:flex;gap:8px;align-items:center}
.hrow{display:flex;gap:6px;margin-bottom:6px}
.fetchbox{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:10px;background:var(--panel2)}
.fetchlist{max-height:220px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px 10px;margin:8px 0;font-family:var(--mono);font-size:12px}
.fetchlist label{display:flex;gap:6px;align-items:center;word-break:break-all}
.route{border:1px solid var(--line);border-radius:8px;padding:12px 12px 0;background:var(--panel2)}
.route details{margin-bottom:12px}
.route summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;user-select:none}
.route details[open] summary{margin-bottom:10px}
.rule{margin-bottom:12px}
.rule-head{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.rule-head .num{font-weight:700;color:var(--muted);min-width:24px}
.rule-head .r-match{flex:1;min-width:150px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.preset{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;color:var(--fg);font:inherit}
.preset:hover{border-color:var(--accent)}
.preset b{display:block;margin-bottom:2px}
.preset span{color:var(--muted);font-size:12px;display:block;overflow-wrap:anywhere}
.cdot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid var(--line)}
.backdrop{position:fixed;inset:0;background:rgba(10,12,15,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
.modal.wide{max-width:860px}
.mhead{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mhead h3{flex:1;word-break:break-all}
.mbody{padding:16px}
.mfoot{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel);border-radius:0 0 12px 12px}
pre.reply{white-space:pre-wrap;word-break:break-word;background:var(--panel2);padding:8px;border-radius:7px;margin:6px 0 0;max-height:200px;overflow:auto}
textarea.yaml{min-height:60vh;font-family:var(--mono);font-size:12.5px;line-height:1.5;tab-size:2;white-space:pre}
#toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13px;word-break:break-word;animation:tin .15s ease-out}
.toast.err{background:var(--err);color:#fff}.toast.ok{background:var(--ok);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
#tokenbox{position:fixed;inset:0;z-index:90;background:rgba(10,12,15,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#tokenbox form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:100%;max-width:360px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--muted);padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.kv div{word-break:break-all}
.rt-sel{font-family:var(--mono);font-size:12.5px}
.rt-compact{max-width:100%;font-size:12px;padding:4px 6px;margin-top:8px}
.runs{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.runs>span{font-size:11.5px;color:var(--muted);font-weight:600}
.stline{font-size:12.5px;color:var(--muted);min-height:18px}
.stline.ok{color:var(--ok)}.stline.err{color:var(--err);white-space:pre-wrap;word-break:break-word}
.mlist{max-height:260px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 10px;margin:8px 0;font-family:var(--mono);font-size:12px}
.mlist label{display:flex;gap:6px;align-items:center;word-break:break-all;padding:2px 0;cursor:pointer}
.mlist .tag{font-family:system-ui,sans-serif;font-size:11px;color:var(--muted)}
details.adv{margin:4px 0 12px}
details.adv>summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;user-select:none}
details.adv[open]>summary{margin-bottom:10px}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;margin-top:6px}
.toolgrid label{display:flex;gap:6px;align-items:flex-start;font-size:13px;cursor:pointer}
.toolgrid label small{display:block;color:var(--muted);font-size:11.5px}
.toolgrid.off label{opacity:.45}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;background:var(--panel);font-size:11px;color:var(--muted)}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.sw.none{width:auto;border-radius:999px;padding:0 10px}
.where{border:1px solid var(--accent-soft);border-radius:10px;padding:10px 12px 2px;margin-bottom:12px;background:var(--panel)}
.where>b{display:block;margin-bottom:6px}
.idtxt{font-size:12px;color:var(--muted)}
.ra{display:flex;gap:4px;justify-content:flex-end}
/* ---- dashboard (series colors validated: blue/orange, both modes) ---- */
:root{--s-sub:#2a78d6;--s-routed:#eb6834;--s-ghost:#f7c3a8;--s-track:#e3ecf8;--grid:#e9ecf0;--axis:#c3c8cf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s-sub:#3987e5;--s-routed:#d95926;--s-ghost:#7f3d20;--s-track:#202b3a;--grid:#262a30;--axis:#3a4048}}
:root[data-theme="dark"]{--s-sub:#3987e5;--s-routed:#d95926;--s-ghost:#7f3d20;--s-track:#202b3a;--grid:#262a30;--axis:#3a4048}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.dgrid{display:grid;gap:14px;margin-bottom:14px}
.dgrid>.panel{margin-bottom:0;min-width:0}
.dgrid.top2{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.dgrid.half{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
#dash section{min-width:0}
#dash>section{margin-bottom:14px}
#dash>section.panel{margin-bottom:14px}
.dhead{margin-bottom:8px}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hero{padding:18px 20px}
.hero-head{display:flex;align-items:center;gap:8px}
.hero-fig{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.hero-fig .big{font-size:52px;line-height:1;font-weight:700;letter-spacing:-.02em}
.hero-fig .unit{font-size:18px;font-weight:600;color:var(--muted)}
.hero-sub{margin:4px 0 14px;color:var(--muted);font-size:13.5px}
.meters{display:flex;flex-direction:column;gap:14px}
.mtop{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mname{font-weight:600}
.meter{position:relative;height:12px;border-radius:6px;background:var(--s-track);overflow:hidden}
.meter .m-used{position:absolute;left:0;top:0;bottom:0;background:var(--s-sub);border-radius:6px 4px 4px 6px}
.meter.warn .m-used{background:var(--warn)}.meter.crit .m-used{background:var(--err)}
.meter .m-ghost{position:absolute;top:0;bottom:0;background:var(--s-ghost);border-radius:4px}
.meter .m-100{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--fg);opacity:.55}
.mcap{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:13px}
.msave{font-weight:600;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw-sub,.sw-routed,.sw-ghost{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.sw-sub{background:var(--s-sub)}.sw-routed{background:var(--s-routed)}.sw-ghost{background:var(--s-ghost)}
.plan-seg{margin-top:10px;max-width:100%;flex-wrap:wrap}
.plan-seg button{padding:6px 12px}
.pcustom{margin-top:10px;max-width:320px}
.pcustom input{width:110px;flex:none}
.pworth{margin:12px 0 0;font-size:13.5px}
#d-kpi .stats{margin-bottom:12px}
.stat .sub{color:var(--muted);font-size:12px;margin-top:2px}
.stat .v{font-variant-numeric:normal}
.split{margin-bottom:0}
.sbar-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:10px;margin:6px 0}
.sbar-k{font-size:12.5px;color:var(--muted)}
.sbar-v{font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sbar{display:flex;gap:2px;height:14px;border-radius:4px;background:var(--panel2);overflow:hidden}
.sbar>div{min-width:3px;flex-grow:0;flex-shrink:0}
.s-sub{background:var(--s-sub);border-radius:4px 0 0 4px}.s-routed{background:var(--s-routed);border-radius:0 4px 4px 0}
.sbar>div:only-child{border-radius:4px}
.chartwrap{position:relative;overflow-x:auto}
svg.chart{display:block;font:11px system-ui,-apple-system,"Segoe UI",sans-serif}
svg.chart .grid{stroke:var(--grid);stroke-width:1}
svg.chart .base{stroke:var(--axis);stroke-width:1}
svg.chart .tick{fill:var(--muted);font-variant-numeric:tabular-nums}
svg.chart .emptyt{fill:var(--muted);font-size:13px}
svg.chart .b-sub{fill:var(--s-sub)}svg.chart .b-routed{fill:var(--s-routed)}
svg.chart .hit{fill:var(--fg);fill-opacity:0;cursor:default}
svg.chart .hit.on{fill-opacity:.06}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.15);border-radius:8px;padding:8px 10px;font-size:12px;min-width:150px;z-index:5}
.tip[hidden]{display:none}
.tip div{display:flex;align-items:center;gap:6px;margin-top:3px}
.tip div span{margin-left:auto;padding-left:12px;font-weight:600;font-variant-numeric:tabular-nums}
.share{display:flex;align-items:center;gap:8px;min-width:120px}
.sharebar{flex:1;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.sharebar i{display:block;height:100%;background:var(--s-routed);border-radius:0 4px 4px 0}
.share span{font-size:12px;color:var(--muted);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.mini>div{background:var(--panel2);border-radius:8px;padding:8px 10px}
.mini span{display:block;font-size:18px;font-weight:650}
.mini span.bad{color:var(--err)}
.mini small{color:var(--muted);font-size:12px}
.alist{list-style:none;margin:0;padding:0}

</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot" id="online" title="Connection"></span><b>claude-hybrid</b><span class="muted small" id="ver"></span></div>
  <nav id="tabs"></nav>
  <div class="actions">
    <button class="btn icon ghost" id="reloadBtn" title="Reload config and agents from disk">↻</button>
    <button class="btn icon ghost" id="themeBtn" title="Toggle light/dark">◐</button>
  </div>
</header>
<main id="view"></main>
<div id="modal-root"></div>
<div id="token-root"></div>
<div id="toasts"></div>
<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const enc = encodeURIComponent;
function h(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
};
function toast(msg, kind) {
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), kind === 'err' ? 6000 : 3000);
}
function fmtNum(n) { return (Number(n) || 0).toLocaleString(); }
function fmtDur(s) {
  s = Math.floor(Number(s) || 0);
  const d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  if (d) return d + 'd ' + hh + 'h';
  if (hh) return hh + 'h ' + m + 'm';
  if (m) return m + 'm ' + sec + 's';
  return sec + 's';
}
function fmtTime(t) {
  const d = new Date(t);
  if (isNaN(d)) return h(t);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}
function statusBadge(st, err) {
  const cls = !st ? 'err' : st < 300 ? 'ok' : st < 500 ? 'warn' : 'err';
  return `<span class="badge ${err && st < 300 ? 'warn' : cls}">${st ? h(st) : 'ERR'}</span>`;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e2) { /* ignore */ }
    ta.remove();
  }
  toast('Copied', 'ok');
}
async function run(fn, btn) {
  if (btn) btn.disabled = true;
  try { return await fn(); }
  catch (e) { toast(e.message || String(e), 'err'); }
  finally { if (btn) btn.disabled = false; }
}
function clone(o) { return JSON.parse(JSON.stringify(o == null ? null : o)); }

/* ---------- token + api ---------- */
(function takeUrlToken() {
  try {
    const u = new URL(location.href);
    const t = u.searchParams.get('token');
    if (t) {
      store.set('chr_token', t);
      u.searchParams.delete('token');
      history.replaceState(null, '', u.pathname + u.search + u.hash);
    }
  } catch (e) { /* ignore */ }
})();
let tokenPromise = null;
function askToken() {
  if (tokenPromise) return tokenPromise;
  tokenPromise = new Promise(resolve => {
    const root = $('#token-root');
    root.innerHTML = `<div id="tokenbox"><form>
      <h3 style="margin-bottom:6px">Panel token required</h3>
      <p class="hint">This panel is protected. Enter the panel token from your config.</p>
      <input type="password" id="tok-in" autocomplete="current-password" placeholder="Token">
      <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn primary" type="submit">Continue</button></div>
    </form></div>`;
    const f = $('form', root);
    setTimeout(() => $('#tok-in').focus(), 0);
    f.onsubmit = e => {
      e.preventDefault();
      const v = $('#tok-in').value.trim();
      if (!v) return;
      store.set('chr_token', v);
      root.innerHTML = '';
      tokenPromise = null;
      resolve();
    };
  });
  return tokenPromise;
}
async function api(method, path, body) {
  const headers = { 'X-CHR': '1' };
  const tok = store.get('chr_token');
  if (tok) headers['X-CHR-Token'] = tok;
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  let res;
  try {
    res = await fetch(path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined, cache: 'no-store' });
  } catch (e) {
    setOnline(false);
    throw new Error('Cannot reach claude-hybrid (' + e.message + ')');
  }
  setOnline(true);
  if (res.status === 401) { await askToken(); return api(method, path, body); }
  const txt = await res.text();
  let data = null;
  if (txt) { try { data = JSON.parse(txt); } catch (e) { data = res.ok ? txt : { error: txt.slice(0, 300) }; } }
  if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
  return data;
}
function setOnline(on) {
  const d = $('#online');
  d.className = 'dot ' + (on ? 'on' : 'off');
  d.title = on ? 'Connected' : 'Not reachable';
}

/* ---------- state ---------- */
const state = {
  status: null, providers: [], agents: [], rules: [], presets: null, meta: null,
  logs: [], lastLogId: 0, logsLoaded: false, paused: false, logFilter: 'all', openErr: new Set()
};
/* Built-in fallback when the server has no /api/meta yet. */
const META_DEFAULT = {
  tools: [
    { name: 'Read', desc: 'Read files' }, { name: 'Write', desc: 'Create files' }, { name: 'Edit', desc: 'Change files' },
    { name: 'Glob', desc: 'Find files by name' }, { name: 'Grep', desc: 'Search in files' }, { name: 'Bash', desc: 'Run commands' },
    { name: 'WebFetch', desc: 'Open web pages' }, { name: 'WebSearch', desc: 'Search the web' }, { name: 'Task', desc: 'Start subagents' },
    { name: 'TodoWrite', desc: 'Keep a todo list' }, { name: 'NotebookEdit', desc: 'Edit notebooks' }
  ],
  claude_models: [{ value: '', label: 'Default (inherit)' }, { value: 'sonnet', label: 'Sonnet' }, { value: 'opus', label: 'Opus' }, { value: 'haiku', label: 'Haiku' }],
  colors: ['red', 'blue', 'green', 'yellow', 'purple', 'orange', 'pink', 'cyan'],
  rule_patterns: [
    { match: 'claude-haiku-*', label: 'Haiku requests (background jobs: titles, summaries)' },
    { match: 'claude-sonnet-*', label: 'Sonnet requests' }, { match: 'claude-opus-*', label: 'Opus requests' }, { match: '*', label: 'Everything' }
  ],
  agent_templates: [
    { id: 'code-reviewer', name: 'code-reviewer', description: 'Reviews code changes for bugs and unclear code. Use after writing or changing code.', tools: 'Read, Grep, Glob, Bash',
      prompt: 'You are a careful code reviewer. Read the changed code, find real bugs, risky edge cases and unclear parts. Report each finding with file, line and a short fix. Do not rewrite code unless asked.' },
    { id: 'researcher', name: 'researcher', description: 'Finds information in the codebase or on the web and reports a short summary.', tools: 'Read, Grep, Glob, WebFetch, WebSearch',
      prompt: 'You are a researcher. Find the facts needed to answer the question. Read sources, then give a short, clear summary with file paths or links.' },
    { id: 'test-writer', name: 'test-writer', description: 'Writes and runs tests for a given piece of code.', tools: 'Read, Write, Edit, Grep, Glob, Bash',
      prompt: 'You write tests. Look at how the project already tests code, follow the same style, add tests for normal and edge cases, run them and report the result.' },
    { id: 'doc-writer', name: 'doc-writer', description: 'Writes or updates documentation and comments.', tools: 'Read, Write, Edit, Grep, Glob',
      prompt: 'You write documentation. Use short, plain sentences. Explain what the code does and how to use it, with small examples.' },
    { id: 'blank', name: '', description: '', tools: '', prompt: '' }
  ]
};
async function loadMeta() {
  if (state.meta) return state.meta;
  let m = null;
  try { m = await api('GET', '/api/meta'); } catch (e) { m = null; }
  const out = {};
  for (const k of Object.keys(META_DEFAULT)) out[k] = m && Array.isArray(m[k]) && m[k].length ? m[k] : META_DEFAULT[k];
  return (state.meta = out);
}
const loadProviders = async () => (state.providers = (await api('GET', '/api/providers')) || []);
const loadAgents = async () => (state.agents = (await api('GET', '/api/agents')) || []);
const loadRules = async () => (state.rules = (await api('GET', '/api/rules')) || []);
const loadStatus = async () => {
  const prev = state.status;
  state.status = await api('GET', '/api/status');
  // Server restarted: log ids start over, so reset the cursor and cached logs.
  if (prev && state.status && Number(state.status.uptime_s) < Number(prev.uptime_s)) {
    state.lastLogId = 0; state.logs = []; state.openErr.clear(); state.logsLoaded = false;
  }
  if (state.status) $('#ver').textContent = state.status.version ? 'v' + String(state.status.version).replace(/^v/, '') : '';
  return state.status;
};
async function fetchLogs() {
  const r = await api('GET', '/api/logs?since=' + state.lastLogId);
  state.logsLoaded = true;
  if (Array.isArray(r) && r.length) {
    for (const e of r) if (e.id > state.lastLogId) state.logs.push(e);
    state.lastLogId = Math.max(state.lastLogId, ...r.map(e => e.id || 0));
    if (state.logs.length > 500) state.logs.splice(0, state.logs.length - 500);
    return true;
  }
  return false;
}

/* ---------- modal ---------- */
function openModal({ title, body, foot, wide }) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="backdrop"><div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true">
    <div class="mhead"><h3>${h(title)}</h3><button class="btn icon ghost" data-close title="Close">✕</button></div>
    <div class="mbody">${body}</div>
    <div class="mfoot">${foot || '<div class="grow"></div><button class="btn" data-close>Close</button>'}</div></div></div>`;
  const m = $('.modal', root);
  $$('[data-close]', m).forEach(b => (b.onclick = closeModal));
  return m;
}
function closeModal() { $('#modal-root').innerHTML = ''; }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal-root').firstChild && !$('#token-root').firstChild) closeModal();
});

/* ---------- route editor ---------- */
let uidN = 0;
const ROUTE_DEFAULT = { provider: '', model: '', max_tokens: 0, temperature: null, reasoning_effort: '', system_mode: 'keep', system_prompt: '' };
function routeBadge(r) {
  if (!r || !r.provider) return '<span class="badge">Anthropic</span>';
  return `<span class="badge routed" title="Routed">${h(r.provider)} / ${h(r.model || 'same model')}</span>`;
}
/* One select value encodes provider + model. */
const rv = (p, m) => JSON.stringify([p || '', p ? m || '' : '']);
function parseRv(v) { try { const a = JSON.parse(v); return { provider: a[0] || '', model: a[0] ? a[1] || '' : '' }; } catch (e) { return { provider: '', model: '' }; } }
function totalModels() { return state.providers.filter(p => p.enabled).reduce((n, p) => n + (p.models || []).length, 0); }
/* Options for the "Runs on" select. q filters model ids; the current choice always stays. */
function routeOptions(r, q) {
  q = (q || '').trim().toLowerCase();
  const cur = rv(r.provider, r.model);
  const sel = v => (v === cur ? ' selected' : '');
  let html = `<option value="${h(rv('', ''))}"${sel(rv('', ''))}>Anthropic — your Claude subscription</option>`;
  const groups = state.providers.filter(p => p.enabled || p.id === r.provider).map(p => ({ id: p.id, label: (p.name || p.id) + (p.enabled ? '' : ' (disabled)'), models: p.models || [] }));
  if (r.provider && !groups.some(g => g.id === r.provider)) groups.push({ id: r.provider, label: r.provider + ' (missing provider)', models: [] });
  for (const g of groups) {
    const items = [['', 'Same model as request']].concat(g.models.map(x => [x, x]));
    if (g.id === r.provider && r.model && !g.models.includes(r.model)) items.push([r.model, r.model + ' (not in list)']);
    const shown = items.filter(([m, l]) => !q || rv(g.id, m) === cur || l.toLowerCase().includes(q) || g.label.toLowerCase().includes(q));
    if (!shown.length) continue;
    html += `<optgroup label="${h(g.label)}">` + shown.map(([m, l]) => `<option value="${h(rv(g.id, m))}"${sel(rv(g.id, m))}>${h(l)}</option>`).join('') + '</optgroup>';
  }
  return html;
}
function mountRoute(el, route) {
  const r = Object.assign({}, ROUTE_DEFAULT, route || {});
  const advOpen = r.max_tokens || r.temperature != null || r.reasoning_effort || (r.system_mode && r.system_mode !== 'keep');
  const many = totalModels() > 30;
  el.innerHTML = `<div class="route">
    <label class="f"><span>Runs on</span>
      ${many ? '<input class="rt-q" type="search" placeholder="Filter models…" spellcheck="false" autocomplete="off">' : ''}
      <select class="rt-sel">${routeOptions(r)}</select>
      <small class="rt-provhint"></small></label>
    <details class="rt-on"${advOpen ? ' open' : ''}><summary>Advanced</summary>
      <div class="grid3">
        <label class="f"><span>Max tokens cap</span><input class="rt-max" type="number" min="0" step="1" value="${r.max_tokens ? h(r.max_tokens) : ''}" placeholder="no cap"></label>
        <label class="f"><span>Temperature</span><input class="rt-temp" type="number" min="0" max="2" step="0.05" value="${r.temperature == null ? '' : h(r.temperature)}" placeholder="keep"></label>
        <label class="f"><span>Reasoning effort</span><select class="rt-eff">
          ${['', 'low', 'medium', 'high'].map(x => `<option value="${x}"${x === r.reasoning_effort ? ' selected' : ''}>${x || 'default'}</option>`).join('')}
          ${r.reasoning_effort && !['low', 'medium', 'high'].includes(r.reasoning_effort) ? `<option selected value="${h(r.reasoning_effort)}">${h(r.reasoning_effort)}</option>` : ''}
        </select></label>
      </div>
      <label class="f"><span>System prompt</span><select class="rt-mode">
        <option value="keep"${r.system_mode === 'replace' || r.system_mode === 'append' ? '' : ' selected'}>Keep original</option>
        <option value="replace"${r.system_mode === 'replace' ? ' selected' : ''}>Replace with text below</option>
        <option value="append"${r.system_mode === 'append' ? ' selected' : ''}>Append text below</option>
      </select></label>
      <label class="f rt-sysw"><textarea class="rt-sys mono" rows="5" placeholder="System prompt text">${h(r.system_prompt)}</textarea></label>
    </details></div>`;
  const sel = $('.rt-sel', el), mode = $('.rt-mode', el), q = $('.rt-q', el);
  const sync = () => {
    const c = parseRv(sel.value);
    const p = state.providers.find(x => x.id === c.provider);
    $$('.rt-on', el).forEach(x => (x.style.display = c.provider ? '' : 'none'));
    $('.rt-provhint', el).textContent = c.provider
      ? (p ? `${p.name || p.id} · ${p.type === 'anthropic' ? 'Anthropic-compatible' : 'OpenAI-compatible'}${c.model ? '' : ' · uses the model Claude Code asks for'}` : 'Provider not found')
      : 'Normal Claude Code. Nothing changes.';
    $('.rt-sysw', el).style.display = mode.value === 'keep' ? 'none' : '';
  };
  if (q) q.oninput = () => { const c = parseRv(sel.value); sel.innerHTML = routeOptions(Object.assign({}, r, c), q.value); sync(); };
  sel.onchange = sync; mode.onchange = sync; sync();
  el._get = () => {
    const c = parseRv(sel.value);
    const t = $('.rt-temp', el).value.trim();
    const tv = t === '' ? null : parseFloat(t);
    if (!c.provider) return Object.assign({}, ROUTE_DEFAULT, { system_prompt: r.system_prompt || '' }, { provider: '' });
    return {
      provider: c.provider,
      model: c.model,
      max_tokens: Math.max(0, parseInt($('.rt-max', el).value, 10) || 0),
      temperature: tv == null || isNaN(tv) ? null : tv,
      reasoning_effort: $('.rt-eff', el).value,
      system_mode: mode.value,
      system_prompt: $('.rt-sys', el).value
    };
  };
  return el;
}

/* ---------- router ---------- */
const TABS = [['dashboard', 'Dashboard'], ['agents', 'Agents'], ['providers', 'Providers'], ['rules', 'Rules'], ['logs', 'Logs'], ['settings', 'Settings'], ['raw', 'Raw config']];
const views = {};
let renderGen = 0;
function curTab() {
  const t = (location.hash || '').replace(/^#\/?/, '');
  return TABS.some(x => x[0] === t) ? t : 'dashboard';
}
$('#tabs').innerHTML = TABS.map(([k, l]) => `<a href="#${k}" data-tab="${k}">${l}</a>`).join('');
async function render() {
  const tab = curTab();
  $$('#tabs a').forEach(a => a.classList.toggle('active', a.dataset.tab === tab));
  const gen = ++renderGen;
  const alive = () => gen === renderGen;
  const v = $('#view');
  v.innerHTML = '<div class="loading">Loading…</div>';
  closeModal();
  try { await views[tab](v, alive); }
  catch (e) {
    if (!alive()) return;
    v.innerHTML = `<div class="errbox">${h(e.message || e)}</div><p><button class="btn" id="retry">Retry</button></p>`;
    $('#retry').onclick = render;
  }
}
window.addEventListener('hashchange', render);

/* ---------- dashboard ---------- */
/* Each section repaints only when its data key changes, so polling never steals focus or resets scroll. */
const dash = {
  usage: null, usageErr: '', usageAt: 0, usageLoading: null, keys: {},
  period: ['today', '7d', '30d'].includes(store.get('chr_dash_period')) ? store.get('chr_dash_period') : '30d',
  chartMode: store.get('chr_dash_chart') === 'tokens' ? 'tokens' : 'usd',
  customOpen: false, savingPlan: false
};
const PERIOD_LABEL = { today: 'Today', '7d': '7 days', '30d': '30 days' };
async function loadUsage() {
  if (dash.usageLoading) return dash.usageLoading;
  dash.usageLoading = (async () => {
    try { dash.usage = await api('GET', '/api/usage'); dash.usageErr = ''; }
    catch (e) { dash.usageErr = e.message || String(e); }
    finally { dash.usageAt = Date.now(); dash.usageLoading = null; }
  })();
  return dash.usageLoading;
}
function fmtCompact(n) {
  n = Number(n) || 0;
  const a = Math.abs(n);
  const f = (x, s) => (x >= 100 ? Math.round(x) : x >= 10 ? x.toFixed(1).replace(/\.0$/, '') : x.toFixed(1).replace(/\.0$/, '')) + s;
  if (a >= 1e9) return f(n / 1e9, 'B');
  if (a >= 1e6) return f(n / 1e6, 'M');
  if (a >= 1e3) return f(n / 1e3, 'K');
  return String(Math.round(n));
}
function fmtMoney(n) {
  n = Number(n) || 0;
  if (n === 0) return '$0';
  if (n < 0.01) return '<$0.01';
  if (n < 10) return '$' + n.toFixed(2);
  if (n < 1000) return '$' + Math.round(n);
  return '$' + fmtCompact(n);
}
function fmtPct(f, digits) {
  const v = (Number(f) || 0) * 100;
  if (digits) return (v > 0 && v < 1 ? v.toFixed(1) : Math.round(v)) + '%';
  return Math.round(v) + '%';
}
function fmtPts(saved) {
  const v = Math.max(0, (Number(saved) || 0) * 100);
  return v < 10 ? v.toFixed(1).replace(/\.0$/, '') : String(Math.round(v));
}
const tokSum = t => (t ? (t.input || 0) + (t.output || 0) + (t.cache_read || 0) + (t.cache_write || 0) : 0);
function claimWindow(claim) {
  const c = String(claim || '');
  if (c.includes('seven_day')) return '7d';
  if (c.includes('five_hour')) return '5h';
  return c;
}
function limitStatusBadge(st) {
  if (!st) return '';
  if (st === 'allowed') return '<span class="badge ok">✓ Allowed</span>';
  if (st === 'allowed_warning') return '<span class="badge warn">! Near limit</span>';
  if (st === 'rejected') return '<span class="badge err">✕ Rate limited</span>';
  return `<span class="badge">${h(st)}</span>`;
}
function resetText(ts) {
  if (!ts) return '';
  const s = ts - Date.now() / 1000;
  return s > 0 ? 'resets in ' + fmtDur(s) : 'reset due';
}
function sourceLabel(src) {
  const s = String(src || '');
  const i = s.indexOf(':');
  const kind = i > 0 ? s.slice(0, i) : '', name = i > 0 ? s.slice(i + 1) : s;
  if (kind === 'agent') return `<span class="badge routed">agent</span> <b>${h(name)}</b>`;
  if (kind === 'rule') return `<span class="badge">rule</span> <b>#${h(name)}</b>`;
  return `<b>${h(s || 'unknown')}</b>`;
}
const ROUTE_CTA = '<a href="#agents">Route an agent to another provider</a> to start saving.';

views.dashboard = async (v, alive) => {
  dash.keys = {};
  const usageP = loadUsage();
  await Promise.all([loadStatus(), state.logsLoaded ? null : fetchLogs().catch(() => null), loadAgents().catch(() => null)]);
  if (!alive()) return;
  v.innerHTML = `<div id="dash">
    <div class="dgrid top2">
      <section class="panel hero" id="d-hero" aria-label="Subscription limit"></section>
      <section class="panel" id="d-plan" aria-label="Your plan"></section>
    </div>
    <section id="d-kpi" aria-label="Offload"></section>
    <section class="panel" id="d-chart" aria-label="Last 30 days"></section>
    <section id="d-src" aria-label="Top routed agents and rules"></section>
    <div class="dgrid half">
      <section class="panel" id="d-status" aria-label="Proxy"></section>
      <section class="panel" id="d-agents" aria-label="Routed agents"></section>
    </div>
    <section id="d-logs" aria-label="Recent requests"></section>
    <section id="d-how"></section>
  </div>`;

/* Repaint one section if its key changed. Skips while the user is typing in it; keeps <details data-k> open state. */
function paintSec(id, key, fn) {
  const el = document.getElementById(id);
  if (!el || dash.keys[id] === key) return;
  const ae = document.activeElement;
  if (dash.keys[id] !== undefined && ae && el.contains(ae) && ae.matches('input,textarea,select')) return;
  const open = {};
  $$('details[data-k]', el).forEach(d => (open[d.dataset.k] = d.open));
  el.innerHTML = fn();
  $$('details[data-k]', el).forEach(d => { if (d.dataset.k in open) d.open = open[d.dataset.k]; });
  dash.keys[id] = key;
}
function paintDash() {
  if (!$('#dash')) return;
  const u = dash.usage;
  const err = dash.usageErr;
  if (!u) {
    const msg = err ? `<div class="errbox">Usage report not available: ${h(err)}</div>` : '<div class="loading">Loading usage…</div>';
    paintSec('d-hero', 'x' + err, () => msg);
  } else {
    paintSec('d-hero', JSON.stringify([u.windows, u.limits]), () => heroHTML(u));
  }
  paintSec('d-plan', JSON.stringify([u && u.plan, u && u.plans, u && u.periods, u && u.plan_value_ratio, dash.customOpen, dash.savingPlan, !!u]), () => planHTML(u));
  paintSec('d-kpi', JSON.stringify([u && u.periods, dash.period]), () => kpiHTML(u));
  const cw = Math.round(($('#d-chart') || {}).clientWidth || 0);
  paintSec('d-chart', JSON.stringify([u && u.days, dash.chartMode, cw]), () => chartHTML(u, cw));
  paintSec('d-src', JSON.stringify(u && u.sources), () => sourcesHTML(u));
  const s = state.status || {};
  paintSec('d-status', JSON.stringify([s.launch_cmd, s.proxy_listen, s.panel_listen, s.config_path, s.agents_dir]), () => statusHTML(s));
  liveStatus();
  paintSec('d-agents', JSON.stringify([state.agents.map(a => [a.name, a.color, a.route]), state.providers.map(p => [p.id, p.name])]), routedAgentsHTML);
  const recent = state.logs.slice(-8).reverse();
  paintSec('d-logs', JSON.stringify([state.logsLoaded, recent.map(e => [e.id, e.status])]), () =>
    `<div class="bar dhead"><h3>Recent requests</h3><div class="grow"></div><a href="#logs" class="small">All logs →</a></div>
     <div class="compact">${logTable(recent, false)}</div>`);
  if (dash.keys['d-logs-bound'] !== dash.keys['d-logs']) { bindLogTable($('#d-logs')); dash.keys['d-logs-bound'] = dash.keys['d-logs']; }
  paintSec('d-how', JSON.stringify([u && u.assumptions, u && u.cache_hit_rate]), () => howHTML(u));
}

function meterHTML(w, binding) {
  const used = Math.max(0, Number(w.utilization) || 0);

  const dom = Math.max(1, est);

  const label = w.label || w.name;

  const aria = `${label}: ${fmtPct(used)} used` + (w.calibrated && est > used ? `, would be ${fmtPct(est)} without routing` : '');
  return `<div class="mrow">
    <div class="mtop"><span class="mname">${h(label)}</span>${binding ? '<span class="badge info" title="This window decides when you get rate limited">binding</span>' : ''}

    <div class="meter${sev}" role="img" aria-label="${h(aria)}">
      <div class="m-used" style="width:${pu.toFixed(2)}%"></div>
      ${ghostW > 0.3 ? `<div class="m-ghost" style="left:calc(${pu.toFixed(2)}% + 2px);width:calc(${ghostW.toFixed(2)}% - 2px)"></div>` : ''}
      ${dom > 1 ? `<div class="m-100" style="left:${(100 / dom).toFixed(2)}%" title="100%"></div>` : ''}
    </div>
    <div class="mcap"><span>${caption}</span><div class="grow"></div>${w.calibrated ? `<span class="msave">${h(fmtPts(w.saved))} pts saved</span>` : ''}</div>
  </div>`;
}

async function savePlan(id, price) {

}
function splitBar(label, a, r, fmt) {
  const t = a + r;
  const pa = t ? a / t * 100 : 0, pr = t ? 100 - pa : 0;
  const aria = t ? `${label}: subscription ${fmt(a)} (${Math.round(pa)}%), routed ${fmt(r)} (${Math.round(pr)}%)` : `${label}: no traffic`;
  return `<div class="sbar-row"><span class="sbar-k">${h(label)}</span>
    <div class="sbar" role="img" aria-label="${h(aria)}">${t ? `${pa > 0 ? `<div class="s-sub" style="flex-basis:${pa}%" title="Subscription ${h(fmt(a))}"></div>` : ''}${pr > 0 ? `<div class="s-routed" style="flex-basis:${pr}%" title="Routed ${h(fmt(r))}"></div>` : ''}` : ''}</div>
    <span class="sbar-v">${t ? `${h(Math.round(pa))}% · <b>${h(pr > 0 && pr < 1 ? pr.toFixed(1) : Math.round(pr))}% routed</b>` : '<span class="muted">no traffic</span>'}</span></div>`;

/* ---- 30-day chart ---- */
/* 4 gridline steps on a 1-2-5 scale. */
function niceStep(v) {
  if (v <= 0) return 0;
  const raw = v / 4, e = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e;
}
function dayLabel(ds, long) {
  const m = /^(\d+)-(\d+)-(\d+)$/.exec(ds || '');
  if (!m) return ds || '';
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return d.toLocaleDateString('en-US', long ? { weekday: 'short', month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric' });
}
function chartHTML(u, cw) {
  const toggle = `<div class="seg" role="group" aria-label="Measure">${[['usd', 'Value'], ['tokens', 'Tokens']].map(([k, l]) => `<button type="button" data-cmode="${k}" class="${dash.chartMode === k ? 'on' : ''}" aria-pressed="${dash.chartMode === k}">${l}</button>`).join('')}</div>`;
  const head = `<div class="bar" style="margin-bottom:4px"><h3>Last 30 days</h3><div class="grow"></div>${toggle}</div>
    <div class="legend small" style="margin-bottom:6px"><span><i class="sw-sub"></i>Subscription</span><span><i class="sw-routed"></i>Routed</span>
      <span class="muted">${dash.chartMode === 'usd' ? 'API-equivalent value per day' : 'tokens per day, incl. cache'}</span></div>`;
  if (!u) return head + '<div class="loading">…</div>';
  const days = u.days || [];
  const tok = dash.chartMode === 'tokens';
  const fmt = tok ? fmtCompact : fmtMoney;
  const rows = days.map(d => ({ date: d.date, a: Number(tok ? d.anthropic_tokens : d.anthropic_usd) || 0, r: Number(tok ? d.routed_tokens : d.routed_usd) || 0 }));
  const W = Math.max(300, (cw || 700) - 30), H = 210;
  const ml = 46, mr = 6, mt = 10, mb = 24;
  const iw = W - ml - mr, ih = H - mt - mb;
  const peak = Math.max(0, ...rows.map(x => x.a + x.r));
  const stp = niceStep(peak), nt = stp ? Math.ceil(peak / stp) : 0, max = stp * nt;
  const n = rows.length || 30, slot = iw / n;
  const bw = Math.max(2, Math.min(18, slot - 2));
  const y = v => mt + ih - (max ? v / max * ih : 0);
  const axisFmt = v => (tok ? fmtCompact(v) : v === 0 ? '$0' : '$' + (v < 1 ? (+v.toFixed(3)).toString() : v < 10 ? (+v.toFixed(1)).toString() : fmtCompact(v)));
  let g = '';
  if (max) for (let i = 0; i <= nt; i++) {
    const v = stp * i, yy = y(v).toFixed(1);
    g += `<line class="${i ? 'grid' : 'base'}" x1="${ml}" x2="${W - mr}" y1="${yy}" y2="${yy}"/><text class="tick" x="${ml - 6}" y="${yy}" dy="0.32em" text-anchor="end">${h(axisFmt(v))}</text>`;
  } else g += `<line class="base" x1="${ml}" x2="${W - mr}" y1="${mt + ih}" y2="${mt + ih}"/>`;
  const topPath = (x, yt, w, hh) => {
    const r = Math.min(4, w / 2, hh);
    return `M${x},${yt + hh}V${yt + r}Q${x},${yt} ${x + r},${yt}H${x + w - r}Q${x + w},${yt} ${x + w},${yt + r}V${yt + hh}Z`;
  };
  let bars = '', hits = '', labels = '';
  const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 60))));
  rows.forEach((d, i) => {
    const x = ml + i * slot + (slot - bw) / 2;
    const base = mt + ih;
    if (max && d.a + d.r > 0) {
      const ha = d.a / max * ih, hr = d.r / max * ih;
      if (ha > 0) bars += hr > 0 ? `<rect class="b-sub" x="${x.toFixed(1)}" y="${(base - ha).toFixed(1)}" width="${bw.toFixed(1)}" height="${ha.toFixed(1)}"/>`
        : `<path class="b-sub" d="${topPath(x, base - Math.max(ha, 1), bw, Math.max(ha, 1))}"/>`;
      if (hr > 0) {
        const gap = ha > 0 ? 2 : 0;
        const hh = Math.max(1, hr - gap);
        bars += `<path class="b-routed" d="${topPath(x, base - ha - gap - hh, bw, hh)}"/>`;
      }
    }
    hits += `<rect class="hit" data-i="${i}" x="${(ml + i * slot).toFixed(1)}" y="${mt}" width="${slot.toFixed(1)}" height="${ih}" aria-label="${h(dayLabel(d.date, true))}: subscription ${h(fmt(d.a))}, routed ${h(fmt(d.r))}"/>`;
    if ((n - 1 - i) % step === 0) labels += `<text class="tick" x="${(i === n - 1 ? W - mr : ml + i * slot + slot / 2).toFixed(1)}" y="${H - 6}" text-anchor="${i === n - 1 ? 'end' : 'middle'}">${h(i === n - 1 ? 'Today' : dayLabel(d.date))}</text>`;
  });
  const empty = !max ? `<text class="emptyt" x="${ml + iw / 2}" y="${mt + ih / 2}" text-anchor="middle">No traffic in the last 30 days</text>` : '';
  const totA = rows.reduce((s, x) => s + x.a, 0), totR = rows.reduce((s, x) => s + x.r, 0);
  const desc = `Stacked daily bars for the last 30 days. Subscription total ${fmt(totA)}, routed total ${fmt(totR)}.`;
  dash.chartRows = { rows, fmt };
  return head + `<div class="chartwrap">
    <svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="chT chD">
      <title id="chT">Subscription vs routed, last 30 days</title><desc id="chD">${h(desc)}</desc>
      ${g}${bars}${labels}${empty}<g class="hits">${hits}</g></svg>
    <div class="tip" id="chTip" hidden></div></div>
    <details class="adv" data-k="chtable" style="margin:6px 0 0"><summary>Show as table</summary>
      <div class="tablewrap" style="max-height:260px;overflow:auto"><table><thead><tr><th>Day</th><th class="num">Subscription</th><th class="num">Routed</th><th class="num">Routed share</th></tr></thead><tbody>
      ${rows.slice().reverse().map(d => `<tr><td>${h(dayLabel(d.date, true))}</td><td class="num">${h(fmt(d.a))}</td><td class="num">${h(fmt(d.r))}</td><td class="num">${d.a + d.r ? h(Math.round(d.r / (d.a + d.r) * 100)) + '%' : '–'}</td></tr>`).join('')}
      </tbody></table></div></details>`;
}
function chartHover(e) {
  const tip = $('#chTip'); if (!tip || !dash.chartRows) return;
  const hit = e.target.closest && e.target.closest('rect.hit');
  $$('#d-chart rect.hit.on').forEach(r => r !== hit && r.classList.remove('on'));
  if (!hit) { tip.hidden = true; return; }
  hit.classList.add('on');
  const d = dash.chartRows.rows[Number(hit.dataset.i)], fmt = dash.chartRows.fmt;
  if (!d) return;
  const t = d.a + d.r;
  tip.innerHTML = `<b>${h(dayLabel(d.date, true))}</b>
    <div><i class="sw-sub"></i>Subscription <span>${h(fmt(d.a))}</span></div>
    <div><i class="sw-routed"></i>Routed <span>${h(fmt(d.r))}</span></div>
    ${t ? `<div class="muted">${h(Math.round(d.r / t * 100))}% routed</div>` : ''}`;
  tip.hidden = false;
  const wrap = tip.parentElement.getBoundingClientRect(), hr = hit.getBoundingClientRect();
  const tw = tip.offsetWidth;
  let left = hr.left - wrap.left + hr.width / 2 - tw / 2;
  left = Math.max(0, Math.min(wrap.width - tw, left));
  tip.style.left = left + 'px';
  tip.style.top = '4px';
}

views.logs = async (v, alive) => {

function paintLogs() {
  const b = $('#logbody'); if (!b) return;
  let list = state.logs.slice().reverse();
  if (state.logFilter === 'routed') list = list.filter(e => e.kind === 'routed');
  if (state.logFilter === 'errors') list = list.filter(e => e.error || !e.status || e.status >= 400);
  b.innerHTML = logTable(list, true);
  bindLogTable(b);
}
let polling = false, tickN = 0;
setInterval(async () => {
  if (document.hidden || polling || $('#token-root').firstChild) return;
  const t = curTab();
  if (t !== 'logs' && t !== 'dashboard') return;
  polling = true;
  try {
    const fresh = await fetchLogs();
    if (t === 'dashboard' && curTab() === 'dashboard') {
      if (++tickN % 3 === 0 || fresh) {
        const before = state.lastLogId;
        await loadStatus();
        if (state.lastLogId < before) await fetchLogs();
      }
      if (Date.now() - dash.usageAt > 30000) await loadUsage();
      paintDash();
    } else if (t === 'logs' && curTab() === 'logs') {
      let changed = fresh;
      if (++tickN % 3 === 0) {
        const before = state.lastLogId;
        await loadStatus();
        if (state.lastLogId < before) { await fetchLogs(); changed = true; }
      }
      if (changed && !state.paused) paintLogs();
    }
  } catch (e) { /* offline indicator handles it */ }
  finally { polling = false; }
}, 2000);

const COLORS = { red: '#e5484d', blue: '#3e7bfa', green: '#30a46c', yellow: '#e2b308', purple: '#8e4ec6', orange: '#f76b15', pink: '#d6409f', cyan: '#05a2c2' };
const sanitizeName = s => String(s || '').toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9_.-]/g, '');

function uniqueName(base) {
  base = sanitizeName(base);
  if (!base || !state.agents.some(x => x.name === base)) return base;
  let n = 2; while (state.agents.some(x => x.name === base + '-' + n)) n++;
  return base + '-' + n;
}
async function saveAgentRoute(a, sel) {

    const saved = await api('PUT', '/api/agents/' + enc(a.name), Object.assign({}, a, { route }));

  } catch (e) {
    a.route = prev;

function openAgentEditor(orig, tpl) {
  const isNew = !orig;
  const meta = state.meta || META_DEFAULT;
  const a = Object.assign({ name: '', description: '', tools: '', model: '', color: '', prompt: '', route: {} }, clone(orig) || {}, isNew ? tpl || {} : {});
  // Claude model select
  const modelVal = a.model === 'inherit' ? '' : a.model;
  const mopts = meta.claude_models.slice();
  if (modelVal && !mopts.some(x => x.value === modelVal)) mopts.push({ value: modelVal, label: modelVal });
  // tools
  const cur = splitTools(a.tools);
  const toolList = meta.tools.map(t => ({ name: t.name, desc: t.desc }));
  cur.forEach(n => { if (!toolList.some(t => t.name === n)) toolList.push({ name: n, desc: 'from file' }); });
  const allTools = !a.tools.trim();
  // colors
  const colors = [''].concat(meta.colors);
  if (a.color && !colors.includes(a.color)) colors.push(a.color);
  const m = openModal({
    title: isNew ? 'New agent' : 'Edit agent: ' + a.name, wide: true,
    body: `<div class="grid2">
      <label class="f"><span>Name</span><input id="ag-name" value="${h(a.name)}" placeholder="my-agent" spellcheck="false" autocomplete="off"><small>Lowercase, no spaces. Also the file name.</small></label>
      <label class="f"><span>Claude model</span><select id="ag-model">${mopts.map(x => `<option value="${h(x.value)}"${x.value === modelVal ? ' selected' : ''}>${h(x.label)}</option>`).join('')}</select>
        <small>What Claude Code asks for. “Runs on” below can send it elsewhere.</small></label>
    </div>
    <label class="f"><span>Description</span><textarea id="ag-desc" rows="2">${h(a.description)}</textarea><small>Claude reads this to decide when to use the agent.</small></label>
    <div class="where"><b>Where does this agent run?</b><div id="ag-route"></div></div>
    <div class="f"><span>Tools</span>
      <label class="check"><input type="checkbox" id="ag-all"${allTools ? ' checked' : ''}> <b>All tools</b></label>
      <div class="toolgrid${allTools ? ' off' : ''}" id="ag-tools">${toolList.map(t => `<label><input type="checkbox" value="${h(t.name)}"${allTools || cur.includes(t.name) ? ' checked' : ''}${allTools ? ' disabled' : ''}><div>${h(t.name)}<small>${h(t.desc || '')}</small></div></label>`).join('')}</div>
    </div>
    <div class="f"><span>Color</span><div class="swatches" id="ag-color">${colors.map(c => c
      ? `<button type="button" class="sw${c === a.color ? ' on' : ''}" data-c="${h(c)}" title="${h(c)}" style="background:${COLORS[c] || 'var(--panel2)'}">${COLORS[c] ? '' : h(c.slice(0, 2))}</button>`
      : `<button type="button" class="sw none${!a.color ? ' on' : ''}" data-c="" title="No color">none</button>`).join('')}</div></div>
    ${a.file ? `<p class="muted small" style="margin-top:0">File: <code>${h(a.file)}</code></p>` : ''}
    <label class="f"><span>Instructions (system prompt)</span><textarea id="ag-prompt" class="mono" rows="12" spellcheck="false" placeholder="You are …">${h(a.prompt)}</textarea></label>`,
    foot: `${isNew ? '' : '<button class="btn danger" id="ag-del">Delete</button>'}<div class="grow"></div>
      <button class="btn" data-close>Cancel</button><button class="btn primary" id="ag-save">Save</button>`
  });
  const re = mountRoute($('#ag-route', m), a.route);
  const nameIn = $('#ag-name', m);
  nameIn.oninput = () => {
    const pos = nameIn.selectionStart, before = nameIn.value, after = sanitizeName(before);
    if (after !== before) { nameIn.value = after; const p = Math.max(0, pos - (before.length - after.length)); nameIn.setSelectionRange(p, p); }
  };
  if (isNew) nameIn.focus();
  const allCb = $('#ag-all', m), grid = $('#ag-tools', m);
  allCb.onchange = () => {
    grid.classList.toggle('off', allCb.checked);
    $$('input', grid).forEach(c => { c.disabled = allCb.checked; if (allCb.checked) c.checked = true; });
  };
  let color = a.color || '';
  $('#ag-color', m).onclick = e => {
    const b = e.target.closest('.sw'); if (!b) return;
    color = b.dataset.c;
    $$('.sw', m).forEach(x => x.classList.toggle('on', x === b));
  };
  $('#ag-save', m).onclick = e => run(async () => {
    const name = nameIn.value.trim();

    await api('PUT', '/api/agents/' + enc(isNew ? name : orig.name), body);
    closeModal();
    toast('Agent saved', 'ok');
    render();
  }, e.target);
  const del = $('#ag-del', m);
  if (del) del.onclick = e => run(async () => {
    if (!confirm(`Move agent "${orig.name}" to trash?`)) return;

    render();
  }, e.target);
