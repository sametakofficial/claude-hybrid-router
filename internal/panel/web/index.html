<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-hybrid</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--panel2:#f1f3f6;--fg:#1b1f24;--muted:#69717d;--line:#dfe3e8;
  --accent:#c2652a;--accent-fg:#fff;--accent-soft:#f8e9df;
  --ok:#1f8a4c;--ok-soft:#e1f4e8;--warn:#a66a00;--warn-soft:#fbf0d9;--err:#c4322b;--err-soft:#fbe4e2;
  --info:#2f63c4;--info-soft:#e3ebfa;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --r:10px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121417;--panel:#1a1d21;--panel2:#22262b;--fg:#e6e8eb;--muted:#959ca6;--line:#2e3339;
    --accent:#e08249;--accent-fg:#1a1208;--accent-soft:#3a2618;
    --ok:#4cc27c;--ok-soft:#173323;--warn:#e0a83a;--warn-soft:#3a2c12;--err:#ef6b63;--err-soft:#3d1a18;
    --info:#7aa5f0;--info-soft:#1a2740;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121417;--panel:#1a1d21;--panel2:#22262b;--fg:#e6e8eb;--muted:#959ca6;--line:#2e3339;
  --accent:#e08249;--accent-fg:#1a1208;--accent-soft:#3a2618;
  --ok:#4cc27c;--ok-soft:#173323;--warn:#e0a83a;--warn-soft:#3a2c12;--err:#ef6b63;--err-soft:#3d1a18;
  --info:#7aa5f0;--info-soft:#1a2740;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;min-height:100vh}
a{color:var(--accent)}
code,pre,.mono{font-family:var(--mono);font-size:12.5px}
code{background:var(--panel2);padding:1px 5px;border-radius:5px}
h2{font-size:18px;margin:0}h3{font-size:16px;margin:0}h4{font-size:13px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand b{font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.on{background:var(--ok)}.dot.off{background:var(--err)}
nav#tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav#tabs::-webkit-scrollbar{display:none}
nav#tabs a{padding:6px 10px;border-radius:7px;color:var(--muted);text-decoration:none;white-space:nowrap;font-weight:500}
nav#tabs a:hover{background:var(--panel2);color:var(--fg)}
nav#tabs a.active{background:var(--accent-soft);color:var(--accent)}
.actions{display:flex;gap:4px}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.grow{flex:1}
.muted{color:var(--muted)}.small{font-size:12px}
.hint{color:var(--muted);margin:0 0 14px;font-size:13px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{background:var(--panel2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--err);border-color:var(--err-soft)}
.btn.danger:hover{background:var(--err-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.icon{padding:5px 8px;min-width:30px}
.btn.sm{padding:3px 8px;font-size:12px}
input,select,textarea{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;width:100%;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
input:disabled{background:var(--panel2);color:var(--muted)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f>span{font-weight:600;font-size:12.5px}
.f small,.f .sub{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.stat .k{color:var(--muted);font-size:12px}
.stat .v{font-size:22px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.stat.err .v{color:var(--err)}.stat.routed .v{color:var(--accent)}
.cmd{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:8px;padding:8px 10px;margin:8px 0}
.cmd code{background:none;font-size:14px;flex:1;overflow-x:auto;white-space:nowrap}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--panel2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
td.errc{white-space:normal;max-width:320px;color:var(--err);cursor:pointer}
td.errc .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.errc.open .t{white-space:pre-wrap;word-break:break-word}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.badge.routed{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.badge.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--accent)}
.card .title{display:flex;align-items:center;gap:8px;font-weight:650;margin-bottom:4px;word-break:break-all}
.card .desc{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px;white-space:pre-line}
.card .meta{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.loading{padding:30px;color:var(--muted);text-align:center}
.errbox{padding:14px;border-radius:var(--r);background:var(--err-soft);color:var(--err)}
.note{padding:10px 12px;border-radius:8px;background:var(--info-soft);color:var(--info);font-size:13px;margin-bottom:12px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.switch{position:relative;display:inline-block;width:34px;height:20px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:20px;cursor:pointer;transition:.15s}
.switch span:before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span:before{transform:translateX(14px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-family:var(--mono);font-size:12px}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 4px;border-radius:50%}
.chip button:hover{color:var(--err)}
.row{display:flex;gap:8px;align-items:center}
.hrow{display:flex;gap:6px;margin-bottom:6px}
.fetchbox{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:10px;background:var(--panel2)}
.fetchlist{max-height:220px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px 10px;margin:8px 0;font-family:var(--mono);font-size:12px}
.fetchlist label{display:flex;gap:6px;align-items:center;word-break:break-all}
.route{border:1px solid var(--line);border-radius:8px;padding:12px 12px 0;background:var(--panel2)}
.route details{margin-bottom:12px}
.route summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;user-select:none}
.route details[open] summary{margin-bottom:10px}
.rule{margin-bottom:12px}
.rule-head{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.rule-head .num{font-weight:700;color:var(--muted);min-width:24px}
.rule-head .r-match{flex:1;min-width:150px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.preset{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;color:var(--fg);font:inherit}
.preset:hover{border-color:var(--accent)}
.preset b{display:block;margin-bottom:2px}
.preset span{color:var(--muted);font-size:12px;display:block;overflow-wrap:anywhere}
.cdot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid var(--line)}
.backdrop{position:fixed;inset:0;background:rgba(10,12,15,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
.modal.wide{max-width:860px}
.mhead{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mhead h3{flex:1;word-break:break-all}
.mbody{padding:16px}
.mfoot{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel);border-radius:0 0 12px 12px}
pre.reply{white-space:pre-wrap;word-break:break-word;background:var(--panel2);padding:8px;border-radius:7px;margin:6px 0 0;max-height:200px;overflow:auto}
textarea.yaml{min-height:60vh;font-family:var(--mono);font-size:12.5px;line-height:1.5;tab-size:2;white-space:pre}
#toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13px;word-break:break-word;animation:tin .15s ease-out}
.toast.err{background:var(--err);color:#fff}.toast.ok{background:var(--ok);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
#tokenbox{position:fixed;inset:0;z-index:90;background:rgba(10,12,15,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#tokenbox form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:100%;max-width:360px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--muted);padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.kv div{word-break:break-all}
.rt-sel{font-family:var(--mono);font-size:12.5px}
.rt-compact{max-width:100%;font-size:12px;padding:4px 6px;margin-top:8px}
.runs{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.runs>span{font-size:11.5px;color:var(--muted);font-weight:600}
.stline{font-size:12.5px;color:var(--muted);min-height:18px}
.stline.ok{color:var(--ok)}.stline.err{color:var(--err);white-space:pre-wrap;word-break:break-word}
.mlist{max-height:260px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 10px;margin:8px 0;font-family:var(--mono);font-size:12px}
.mlist label{display:flex;gap:6px;align-items:center;word-break:break-all;padding:2px 0;cursor:pointer}
.mlist .tag{font-family:system-ui,sans-serif;font-size:11px;color:var(--muted)}
details.adv{margin:4px 0 12px}
details.adv>summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;user-select:none}
details.adv[open]>summary{margin-bottom:10px}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;margin-top:6px}
.toolgrid label{display:flex;gap:6px;align-items:flex-start;font-size:13px;cursor:pointer}
.toolgrid label small{display:block;color:var(--muted);font-size:11.5px}
.toolgrid.off label{opacity:.45}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;background:var(--panel);font-size:11px;color:var(--muted)}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.sw.none{width:auto;border-radius:999px;padding:0 10px}
.where{border:1px solid var(--accent-soft);border-radius:10px;padding:10px 12px 2px;margin-bottom:12px;background:var(--panel)}
.where>b{display:block;margin-bottom:6px}
.idtxt{font-size:12px;color:var(--muted)}
.ra{display:flex;gap:4px;justify-content:flex-end}
@media (max-width:760px){
  .top{flex-wrap:wrap;gap:6px 10px;padding:8px 12px}
  nav#tabs{order:3;flex-basis:100%}
  .brand{flex:1}
  .stats{grid-template-columns:1fr 1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  main{padding:14px 12px 60px}
  .backdrop{padding:0}
  .modal,.modal.wide{border-radius:0;min-height:100vh;border:0}
  .mfoot{border-radius:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot" id="online" title="Connection"></span><b>claude-hybrid</b><span class="muted small" id="ver"></span></div>
  <nav id="tabs"></nav>
  <div class="actions">
    <button class="btn icon ghost" id="reloadBtn" title="Reload config and agents from disk">↻</button>
    <button class="btn icon ghost" id="themeBtn" title="Toggle light/dark">◐</button>
  </div>
</header>
<main id="view"></main>
<div id="modal-root"></div>
<div id="token-root"></div>
<div id="toasts"></div>
<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const enc = encodeURIComponent;
function h(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
};
function toast(msg, kind) {
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), kind === 'err' ? 6000 : 3000);
}
function fmtNum(n) { return (Number(n) || 0).toLocaleString(); }
function fmtDur(s) {
  s = Math.floor(Number(s) || 0);
  const d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  if (d) return d + 'd ' + hh + 'h';
  if (hh) return hh + 'h ' + m + 'm';
  if (m) return m + 'm ' + sec + 's';
  return sec + 's';
}
function fmtTime(t) {
  const d = new Date(t);
  if (isNaN(d)) return h(t);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}
function statusBadge(st, err) {
  const cls = !st ? 'err' : st < 300 ? 'ok' : st < 500 ? 'warn' : 'err';
  return `<span class="badge ${err && st < 300 ? 'warn' : cls}">${st ? h(st) : 'ERR'}</span>`;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e2) { /* ignore */ }
    ta.remove();
  }
  toast('Copied', 'ok');
}
async function run(fn, btn) {
  if (btn) btn.disabled = true;
  try { return await fn(); }
  catch (e) { toast(e.message || String(e), 'err'); }
  finally { if (btn) btn.disabled = false; }
}
function clone(o) { return JSON.parse(JSON.stringify(o == null ? null : o)); }

/* ---------- token + api ---------- */
(function takeUrlToken() {
  try {
    const u = new URL(location.href);
    const t = u.searchParams.get('token');
    if (t) {
      store.set('chr_token', t);
      u.searchParams.delete('token');
      history.replaceState(null, '', u.pathname + u.search + u.hash);
    }
  } catch (e) { /* ignore */ }
})();
let tokenPromise = null;
function askToken() {
  if (tokenPromise) return tokenPromise;
  tokenPromise = new Promise(resolve => {
    const root = $('#token-root');
    root.innerHTML = `<div id="tokenbox"><form>
      <h3 style="margin-bottom:6px">Panel token required</h3>
      <p class="hint">This panel is protected. Enter the panel token from your config.</p>
      <input type="password" id="tok-in" autocomplete="current-password" placeholder="Token">
      <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn primary" type="submit">Continue</button></div>
    </form></div>`;
    const f = $('form', root);
    setTimeout(() => $('#tok-in').focus(), 0);
    f.onsubmit = e => {
      e.preventDefault();
      const v = $('#tok-in').value.trim();
      if (!v) return;
      store.set('chr_token', v);
      root.innerHTML = '';
      tokenPromise = null;
      resolve();
    };
  });
  return tokenPromise;
}
async function api(method, path, body) {
  const headers = { 'X-CHR': '1' };
  const tok = store.get('chr_token');
  if (tok) headers['X-CHR-Token'] = tok;
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  let res;
  try {
    res = await fetch(path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined, cache: 'no-store' });
  } catch (e) {
    setOnline(false);
    throw new Error('Cannot reach claude-hybrid (' + e.message + ')');
  }
  setOnline(true);
  if (res.status === 401) { await askToken(); return api(method, path, body); }
  const txt = await res.text();
  let data = null;
  if (txt) { try { data = JSON.parse(txt); } catch (e) { data = res.ok ? txt : { error: txt.slice(0, 300) }; } }
  if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
  return data;
}
function setOnline(on) {
  const d = $('#online');
  d.className = 'dot ' + (on ? 'on' : 'off');
  d.title = on ? 'Connected' : 'Not reachable';
}

/* ---------- state ---------- */
const state = {
  status: null, providers: [], agents: [], rules: [], presets: null, meta: null,
  logs: [], lastLogId: 0, logsLoaded: false, paused: false, logFilter: 'all', openErr: new Set()
};
/* Built-in fallback when the server has no /api/meta yet. */
const META_DEFAULT = {
  tools: [
    { name: 'Read', desc: 'Read files' }, { name: 'Write', desc: 'Create files' }, { name: 'Edit', desc: 'Change files' },
    { name: 'Glob', desc: 'Find files by name' }, { name: 'Grep', desc: 'Search in files' }, { name: 'Bash', desc: 'Run commands' },

function routeBadge(r) {

  return `<span class="badge routed" title="Routed">${h(r.provider)} / ${h(r.model || 'same model')}</span>`;
}
/* One select value encodes provider + model. */
const rv = (p, m) => JSON.stringify([p || '', p ? m || '' : '']);
function parseRv(v) { try { const a = JSON.parse(v); return { provider: a[0] || '', model: a[0] ? a[1] || '' : '' }; } catch (e) { return { provider: '', model: '' }; } }
function totalModels() { return state.providers.filter(p => p.enabled).reduce((n, p) => n + (p.models || []).length, 0); }
/* Options for the "Runs on" select. q filters model ids; the current choice always stays. */
function routeOptions(r, q) {
  q = (q || '').trim().toLowerCase();
  const cur = rv(r.provider, r.model);
  const sel = v => (v === cur ? ' selected' : '');
  let html = `<option value="${h(rv('', ''))}"${sel(rv('', ''))}>Anthropic — your Claude subscription</option>`;
  const groups = state.providers.filter(p => p.enabled || p.id === r.provider).map(p => ({ id: p.id, label: (p.name || p.id) + (p.enabled ? '' : ' (disabled)'), models: p.models || [] }));
  if (r.provider && !groups.some(g => g.id === r.provider)) groups.push({ id: r.provider, label: r.provider + ' (missing provider)', models: [] });
  for (const g of groups) {
    const items = [['', 'Same model as request']].concat(g.models.map(x => [x, x]));
    if (g.id === r.provider && r.model && !g.models.includes(r.model)) items.push([r.model, r.model + ' (not in list)']);
    const shown = items.filter(([m, l]) => !q || rv(g.id, m) === cur || l.toLowerCase().includes(q) || g.label.toLowerCase().includes(q));
    if (!shown.length) continue;
    html += `<optgroup label="${h(g.label)}">` + shown.map(([m, l]) => `<option value="${h(rv(g.id, m))}"${sel(rv(g.id, m))}>${h(l)}</option>`).join('') + '</optgroup>';
  }
  return html;
}

        <label class="f"><span>Reasoning effort</span><select class="rt-eff">

        <option value="append"${r.system_mode === 'append' ? ' selected' : ''}>Append text below</option>

  const sel = $('.rt-sel', el), mode = $('.rt-mode', el), q = $('.rt-q', el);

      : 'Normal Claude Code. Nothing changes.';
    $('.rt-sysw', el).style.display = mode.value === 'keep' ? 'none' : '';
  };

  sel.onchange = sync; mode.onchange = sync; sync();

    const c = parseRv(sel.value);
    const t = $('.rt-temp', el).value.trim();
    const tv = t === '' ? null : parseFloat(t);
    if (!c.provider) return Object.assign({}, ROUTE_DEFAULT, { system_prompt: r.system_prompt || '' }, { provider: '' });
    return {

      reasoning_effort: $('.rt-eff', el).value,

}

function openAgentEditor(orig, tpl) {
  const isNew = !orig;

    </div>
    <div class="f"><span>Color</span><div class="swatches" id="ag-color">${colors.map(c => c
      ? `<button type="button" class="sw${c === a.color ? ' on' : ''}" data-c="${h(c)}" title="${h(c)}" style="background:${COLORS[c] || 'var(--panel2)'}">${COLORS[c] ? '' : h(c.slice(0, 2))}</button>`
      : `<button type="button" class="sw none${!a.color ? ' on' : ''}" data-c="" title="No color">none</button>`).join('')}</div></div>
    ${a.file ? `<p class="muted small" style="margin-top:0">File: <code>${h(a.file)}</code></p>` : ''}
    <label class="f"><span>Instructions (system prompt)</span><textarea id="ag-prompt" class="mono" rows="12" spellcheck="false" placeholder="You are …">${h(a.prompt)}</textarea></label>`,
    foot: `${isNew ? '' : '<button class="btn danger" id="ag-del">Delete</button>'}<div class="grow"></div>
      <button class="btn" data-close>Cancel</button><button class="btn primary" id="ag-save">Save</button>`
  });
  const re = mountRoute($('#ag-route', m), a.route);
  const nameIn = $('#ag-name', m);
  nameIn.oninput = () => {
    const pos = nameIn.selectionStart, before = nameIn.value, after = sanitizeName(before);
    if (after !== before) { nameIn.value = after; const p = Math.max(0, pos - (before.length - after.length)); nameIn.setSelectionRange(p, p); }
  };
  if (isNew) nameIn.focus();
  const allCb = $('#ag-all', m), grid = $('#ag-tools', m);
  allCb.onchange = () => {
    grid.classList.toggle('off', allCb.checked);
    $$('input', grid).forEach(c => { c.disabled = allCb.checked; if (allCb.checked) c.checked = true; });
  };
  let color = a.color || '';
  $('#ag-color', m).onclick = e => {
    const b = e.target.closest('.sw'); if (!b) return;
    color = b.dataset.c;

  };
  $('#ag-save', m).onclick = e => run(async () => {
    const name = nameIn.value.trim();
    if (!name) throw new Error('Please enter a name');
    if (!/^[A-Za-z0-9_.-]+$/.test(name)) throw new Error('Name may only use letters, digits, . _ -');
    let tools = '';
    if (!allCb.checked) {
      const picked = $$('input:checked', grid).map(c => c.value);
      if (!picked.length) throw new Error('Pick at least one tool, or check “All tools”');
      tools = picked.join(', ');
    }

    if (!model && a.model === 'inherit') model = 'inherit';

      name,

      prompt: $('#ag-prompt', m).value,

    if ((isNew || name !== orig.name) && state.agents.some(x => x.name === name)) throw new Error('An agent with this name already exists');

    render();
  }, e.target);

function slugId(name, selfId) {
  let base = String(name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'provider';
  const taken = id => id !== selfId && state.providers.some(x => x.id === id);

    const id = curId();
    const base = urlIn.value.trim();
    if (!base) throw new Error('Base URL is required');
    const models = all.filter(x => picked.has(x));
    if (all.length && !models.length) throw new Error('Pick at least one model');
    const key = keyIn.value.trim();
    const body = Object.assign({}, p, {
      id, name, type: typeSel.value, base_url: base,
      api_key: key || (isNew ? '' : p.api_key || ''), api_key_env: envIn.value.trim(),
      headers: readHeaders(), models, max_tokens_field: typeSel.value === 'openai' ? $('#pv-mtf', m).value : '',
      enabled: $('#pv-en', m).checked
    });
    delete body.has_api_key;
    const saved = await api('PUT', '/api/providers/' + enc(id) + (isNew ? '?create=1' : ''), body);
    await loadProviders();
    closeModal();
    const n = ((saved && saved.models) || models).length;
    toast(`Provider saved · ${n} models`, 'ok');
    if (curTab() === 'providers') await views.providers($('#view'), () => true);
  }, e.target);
  const del = $('#pv-del', m);
  if (del) del.onclick = e => run(async () => {
    if (!confirm(`Delete provider "${p.name || p.id}"?`)) return;
    await api('DELETE', '/api/providers/' + enc(p.id));
    closeModal(); toast('Provider deleted', 'ok'); render();
  }, e.target);
}

/* ---------- rules ---------- */
let rulesDraft = [];
const CUSTOM = '__custom__';
views.rules = async (v, alive) => {
  await Promise.all([loadProviders(), loadRules(), loadMeta()]);
  if (!alive()) return;
  rulesDraft = clone(state.rules) || [];
  v.innerHTML = `<div class="bar"><h2>Rules</h2><div class="grow"></div>
    <button class="btn" id="addRule">+ Add rule</button><button class="btn primary" id="saveRules">Save all</button></div>
    <p class="hint">For requests that are not from a routed agent. Pick which requests, then where they run. First match wins. No match = your subscription.</p>
    <div id="rulelist"></div>`;
  paintRules();
  $('#addRule').onclick = () => {
    syncRules();
    const pats = state.meta.rule_patterns;
    rulesDraft.push({ match: pats.length ? pats[0].match : '', enabled: true, note: '', route: Object.assign({}, ROUTE_DEFAULT) });
    paintRules();
    const sels = $$('#rulelist .r-msel'); if (sels.length) sels[sels.length - 1].focus();
  };
  $('#saveRules').onclick = e => run(async () => {
    syncRules();
    rulesDraft.forEach((r, i) => { if (!r.match) throw new Error(`Rule #${i + 1} needs a pattern`); });
    state.rules = (await api('PUT', '/api/rules', rulesDraft)) || rulesDraft;
    rulesDraft = clone(state.rules);
    paintRules();
    toast('Rules saved', 'ok');
  }, e.target);
};
function syncRules() {
  $$('#rulelist .rule').forEach(card => {
    const r = rulesDraft[Number(card.dataset.i)];
    if (!r) return;
    const sv = $('.r-msel', card).value;
    r.match = sv === CUSTOM ? $('.r-match', card).value.trim() : sv;
    r.enabled = $('.r-en', card).checked;
    r.note = $('.r-note', card).value;
    r.route = $('.r-route', card)._get();
  });
}
function paintRules() {
  const box = $('#rulelist'); if (!box) return;
  if (!rulesDraft.length) { box.innerHTML = '<div class="empty">No rules: everything not from a routed agent uses your subscription.</div>'; return; }
  const pats = (state.meta || META_DEFAULT).rule_patterns;
  box.innerHTML = rulesDraft.map((r, i) => {
    const known = pats.some(p => p.match === r.match);
    return `<div class="card rule" data-i="${i}">
    <div class="rule-head"><span class="num">#${i + 1}</span>
      <label class="switch" title="Enabled"><input type="checkbox" class="r-en"${r.enabled ? ' checked' : ''}><span></span></label>
      <select class="r-msel r-match-sel" style="flex:1;min-width:170px">${pats.map(p => `<option value="${h(p.match)}"${p.match === r.match ? ' selected' : ''}>${h(p.label)}</option>`).join('')}
        <option value="${h(CUSTOM)}"${known ? '' : ' selected'}>Custom pattern…</option></select>
      <button class="btn icon" data-act="up" title="Move up"${i === 0 ? ' disabled' : ''}>↑</button>
      <button class="btn icon" data-act="down" title="Move down"${i === rulesDraft.length - 1 ? ' disabled' : ''}>↓</button>
      <button class="btn icon danger" data-act="del" title="Delete">✕</button></div>
    <label class="f r-cw"${known ? ' style="display:none"' : ''}><input class="r-match mono" value="${h(known ? '' : r.match)}" placeholder="claude-*-latest" spellcheck="false">
      <small>Glob on the requested model name. <code>*</code> = anything.</small></label>
    <label class="f"><input class="r-note" value="${h(r.note)}" placeholder="Note (optional)"></label>
    <div class="r-route"></div></div>`;
  }).join('');
  $$('.rule', box).forEach(card => {
    mountRoute($('.r-route', card), rulesDraft[Number(card.dataset.i)].route);
    const sel = $('.r-msel', card);
    sel.onchange = () => {
      const c = sel.value === CUSTOM;
      $('.r-cw', card).style.display = c ? '' : 'none';
      if (c) $('.r-match', card).focus();
    };
  });
  box.onclick = e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const i = Number(b.closest('.rule').dataset.i);
    syncRules();
    if (b.dataset.act === 'up' && i > 0) rulesDraft.splice(i - 1, 0, rulesDraft.splice(i, 1)[0]);
    else if (b.dataset.act === 'down' && i < rulesDraft.length - 1) rulesDraft.splice(i + 1, 0, rulesDraft.splice(i, 1)[0]);
    else if (b.dataset.act === 'del') { if (!confirm(`Delete rule #${i + 1}?`)) return; rulesDraft.splice(i, 1); }
    paintRules();
  };
}

/* ---------- settings ---------- */
views.settings = async (v, alive) => {
  const s = await api('GET', '/api/settings');
  if (!alive()) return;
  const fld = (k, label, hint, attrs) => `<label class="f"><span>${label}</span><input id="st-${k}" class="mono" value="${h(s[k])}" spellcheck="false" ${attrs || ''}>${hint ? `<small>${hint}</small>` : ''}</label>`;
  v.innerHTML = `<div class="bar"><h2>Settings</h2><div class="grow"></div><button class="btn primary" id="saveSet">Save</button></div>
    <div id="st-note"></div>
    <div class="panel">
      <div class="grid2">
        ${fld('proxy_listen', 'Proxy listen', 'Address Claude Code connects to. Restart needed.')}
        ${fld('panel_listen', 'Panel listen', 'Address of this panel. Restart needed.')}
      </div>
      <div class="grid2">
        ${fld('upstream', 'Anthropic upstream', 'Where pass-through requests go.')}
        ${fld('header_timeout', 'Header timeout (seconds)', 'How long to wait for response headers.', 'type="number" min="0" step="1"')}
      </div>
      <div class="grid2">
        ${fld('agents_dir', 'Agents directory', 'Folder with agent .md files.')}
        ${fld('log_file', 'Log file', 'Empty = no log file.')}
      </div>
      <label class="f"><span>Panel token</span><input id="st-tok" type="password" autocomplete="new-password" placeholder="${h(s.panel_token ? s.panel_token : 'not set')}">
        <small>${s.panel_token ? 'A token is set. Leave blank to keep it.' : 'Optional. Protects this panel.'}</small></label>
    </div>`;
  $('#saveSet').onclick = e => run(async () => {
    const body = Object.assign({}, s);
    ['proxy_listen', 'panel_listen', 'upstream', 'agents_dir', 'log_file'].forEach(k => (body[k] = $('#st-' + k).value.trim()));
    body.header_timeout = Math.max(0, parseInt($('#st-header_timeout').value, 10) || 0);
    const tok = $('#st-tok').value.trim();
    body.panel_token = tok || s.panel_token || '';
    const r = await api('PUT', '/api/settings', body);
    if (tok) store.set('chr_token', tok);
    if (r && r.settings) Object.assign(s, r.settings);
    $('#st-tok').value = '';
    $('#st-note').innerHTML = r && r.restart_required ? '<div class="note warn">Saved. Restart claude-hybrid to apply the new listen address.</div>' : '';
    toast('Settings saved', 'ok');
  }, e.target);
};

/* ---------- raw config ---------- */
views.raw = async (v, alive) => {
  const r = await api('GET', '/api/config/raw');
  if (!alive()) return;
  v.innerHTML = `<div class="bar"><h2>Raw config</h2><div class="grow"></div>
    <button class="btn" id="rawReload" title="Re-read config and agents from disk">Reload</button><button class="btn primary" id="rawSave">Save</button></div>
    <div class="note warn">API keys are shown masked. Masked values are kept as they are when you save. Invalid YAML is rejected.</div>
    <textarea id="rawText" class="yaml" spellcheck="false"></textarea>`;
  const ta = $('#rawText');
  ta.value = (r && r.yaml) || '';
  ta.onkeydown = e => {
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); ta.setRangeText('  ', ta.selectionStart, ta.selectionEnd, 'end'); }
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); $('#rawSave').click(); }
  };
  $('#rawSave').onclick = e => run(async () => {
    await api('PUT', '/api/config/raw', { yaml: ta.value });
    toast('Config saved', 'ok');
  }, e.target);
  $('#rawReload').onclick = e => run(async () => {
    await api('POST', '/api/reload');
    const r2 = await api('GET', '/api/config/raw');
    ta.value = (r2 && r2.yaml) || '';
    toast('Reloaded from disk', 'ok');
  }, e.target);
};

/* ---------- header actions + theme ---------- */
function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
applyTheme(store.get('chr_theme'));
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') ||
    (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next); store.set('chr_theme', next);
};
$('#reloadBtn').onclick = e => run(async () => {
  if ($('#modal-root').firstChild && !confirm('Reload from disk? Unsaved changes in the open editor will be lost.')) return;
  await api('POST', '/api/reload');
  toast('Reloaded config and agents', 'ok');
  render();
}, e.currentTarget);

loadStatus().catch(() => {});
Promise.all([loadMeta(), loadProviders(), loadAgents()]).catch(() => {}).finally(render);
</script>
</body>
</html>
