  $$('button[data-act]', v).forEach(b => (b.onclick = e => {
    e.stopPropagation();
    const p = list[Number(b.dataset.i)];
    if (b.dataset.act === 'test') return openTestModal(p);
    run(async () => {
      const saved = await api('POST', `/api/providers/${enc(p.id)}/refresh`);
      toast(`${p.name || p.id}: ${((saved && saved.models) || []).length} models`, 'ok');
      await loadProviders();
      if (curTab() === 'providers') views.providers($('#view'), () => true);
    }, b);
  }));
  $$('input[data-en]', v).forEach(cb => (cb.onchange = () => {
    const p = list[Number(cb.dataset.en)];
    run(async () => {
      try {
        const saved = await api('PUT', '/api/providers/' + enc(p.id), Object.assign({}, p, { enabled: cb.checked }));
        Object.assign(p, saved || { enabled: cb.checked });
        toast(`${p.name || p.id} ${cb.checked ? 'enabled' : 'disabled'}`, 'ok');
      } catch (err) { cb.checked = !cb.checked; throw err; }
    });
  }));
};
async function openPresetPicker() {
  await run(async () => {
    if (!state.presets) state.presets = (await api('GET', '/api/presets')) || [];
    const m = openModal({
      title: 'Add provider', wide: true,
      body: `<p class="hint">Pick your service. The form is filled in for you.</p><div class="presets">
        ${state.presets.map((p, i) => `<button class="preset" data-i="${i}"><b>${h(p.name)}</b><span>${h(p.base_url)}</span>${p.note ? `<span>${h(p.note)}</span>` : ''}</button>`).join('')}
        <button class="preset" data-i="-1"><b>Other</b><span>Any OpenAI- or Anthropic-compatible API</span></button></div>`
    });
    $$('.preset', m).forEach(b => (b.onclick = () => {
      const pr = state.presets[Number(b.dataset.i)];
      openProviderEditor({
        id: '', name: pr ? pr.name : '', type: pr ? pr.type : 'openai', base_url: pr ? pr.base_url : '',
        api_key: '', has_api_key: false, api_key_env: pr ? pr.api_key_env || '' : '', headers: {},
        models: pr ? (pr.models || []).slice() : [], max_tokens_field: pr ? pr.max_tokens_field || '' : '', enabled: true
      }, true);
    }));
  });
}
function hdrRow(k, val) {
  return `<div class="hrow"><input class="hk mono" placeholder="Header-Name" value="${h(k)}" spellcheck="false"><input class="hv mono" placeholder="value" value="${h(val)}" spellcheck="false"><button class="btn icon ghost" data-rm title="Remove">✕</button></div>`;
}
function openProviderEditor(orig, isNew) {
  const p = Object.assign({ id: '', name: '', type: 'openai', base_url: '', api_key: '', has_api_key: false, api_key_env: '', headers: {}, models: [], max_tokens_field: '', enabled: true }, clone(orig));
  // Model checklist state: every id we know, and which ones are checked.
  let all = (p.models || []).slice();
  const picked = new Set(all);
  const manual = new Set();
  let touched = false, live = null;
  const advOpen = !!(p.api_key_env || Object.keys(p.headers || {}).length || p.max_tokens_field);
  const m = openModal({
    title: isNew ? 'New provider' : 'Provider: ' + (p.name || p.id), wide: true,
    body: `<label class="f"><span>Name</span><input id="pv-name" value="${h(p.name)}" placeholder="e.g. OpenCode Go" autocomplete="off">
        <small class="idtxt">ID: <code id="pv-id">${h(isNew ? slugId(p.name) : p.id)}</code>${isNew ? ' (made from the name)' : ''}</small></label>
    <div class="grid2">
      <label class="f"><span>Type</span><select id="pv-type"><option value="openai"${p.type !== 'anthropic' ? ' selected' : ''}>OpenAI-compatible</option><option value="anthropic"${p.type === 'anthropic' ? ' selected' : ''}>Anthropic-compatible</option></select>
        <small id="pv-typehint"></small></label>
      <label class="f"><span>Base URL</span><input id="pv-url" class="mono" value="${h(p.base_url)}" placeholder="https://api.example.com/v1" spellcheck="false"><small id="pv-urlhint"></small></label>
    </div>
    <label class="f"><span>API key</span><input id="pv-key" type="password" autocomplete="new-password" placeholder="${h(p.has_api_key ? p.api_key || '••••' : 'Paste your key')}">
      <small>${p.has_api_key ? 'Leave blank to keep the current key.' : 'Not needed for local servers.'}</small></label>
    <h4>Models</h4>
    <div class="row" style="margin-bottom:6px"><button class="btn" id="pv-load" type="button">↻ Load models</button><span class="stline" id="pv-st"></span></div>
    <div class="fetchbox" id="pv-mbox">
      <div class="row"><input id="pv-q" type="search" placeholder="Search models" spellcheck="false" autocomplete="off">
        <button class="btn sm" id="pv-all" type="button">Select all</button><button class="btn sm" id="pv-none" type="button">None</button></div>
      <div class="mlist" id="pv-list"></div>
      <div class="small muted" id="pv-count"></div>
    </div>
    <details class="adv" id="pv-manual"><summary>Add model manually</summary>
      <div class="row"><input id="pv-madd" class="mono" placeholder="model id" spellcheck="false"><button class="btn" id="pv-maddb" type="button">Add</button></div>
      <small class="muted">Only if the list above does not load.</small>
    </details>
    <details class="adv"${advOpen ? ' open' : ''}><summary>Advanced</summary>
      <div class="grid2">
        <label class="f" id="pv-mtfw"><span>Max tokens field</span><select id="pv-mtf">
          <option value=""${!p.max_tokens_field ? ' selected' : ''}>Default</option>
          <option value="max_tokens"${p.max_tokens_field === 'max_tokens' ? ' selected' : ''}>max_tokens</option>
          <option value="max_completion_tokens"${p.max_tokens_field === 'max_completion_tokens' ? ' selected' : ''}>max_completion_tokens</option>
        </select><small>Newer OpenAI models need max_completion_tokens.</small></label>
        <label class="f"><span>API key env var</span><input id="pv-env" class="mono" value="${h(p.api_key_env)}" placeholder="OPENAI_API_KEY" spellcheck="false"><small>Optional. Read the key from this environment variable.</small></label>
      </div>
      <div class="f"><span>Extra headers</span>
        <div id="pv-hdrs">${Object.entries(p.headers || {}).map(([k, val]) => hdrRow(k, val)).join('')}</div>
        <div><button class="btn sm" id="pv-hadd" type="button">+ Header</button></div></div>
    </details>
    <label class="check" style="margin-bottom:8px"><input type="checkbox" id="pv-en"${p.enabled ? ' checked' : ''}> Enabled (show in “Runs on” lists)</label>
    ${isNew ? '' : '<h4>Test</h4><div id="pv-test"></div>'}`,
    foot: `${isNew ? '' : '<button class="btn danger" id="pv-del">Delete</button>'}<div class="grow"></div>
      <button class="btn" data-close>Cancel</button><button class="btn primary" id="pv-save">Save</button>`
  });
  const typeSel = $('#pv-type', m), urlIn = $('#pv-url', m), keyIn = $('#pv-key', m), envIn = $('#pv-env', m), nameIn = $('#pv-name', m);
  const hdrs = $('#pv-hdrs', m), st = $('#pv-st', m), q = $('#pv-q', m);
  const readHeaders = () => { const o = {}; $$('.hrow', hdrs).forEach(r => { const k = $('.hk', r).value.trim(); if (k) o[k] = $('.hv', r).value; }); return o; };
  const curId = () => (isNew ? slugId(nameIn.value) : p.id);
  if (isNew) nameIn.oninput = () => ($('#pv-id', m).textContent = curId());
  const syncType = () => {
    const oa = typeSel.value === 'openai';
    $('#pv-mtfw', m).style.display = oa ? '' : 'none';
    $('#pv-typehint', m).textContent = oa ? 'Most services (OpenAI, OpenRouter, Ollama, OpenCode…). Requests are translated.' : 'Speaks the Claude API. Requests are sent as they are.';
    const base = (urlIn.value.trim() || '{base_url}').replace(/\/+$/, '');
    $('#pv-urlhint', m).textContent = 'Requests go to ' + base + (oa ? '/chat/completions' : '/v1/messages');
  };
  syncType();
  const setStatus = (txt, kind) => {
    txt = String(txt || '');
    st.textContent = txt.length > 300 ? txt.slice(0, 300) + '…' : txt;
    st.title = txt.length > 300 ? txt : '';
    st.className = 'stline' + (kind ? ' ' + kind : '');
  };
  const paintList = () => {
    const qq = q.value.trim().toLowerCase();
    const box = $('#pv-list', m);
    $('#pv-mbox', m).style.display = all.length ? '' : 'none';
    box.innerHTML = all.filter(x => !qq || x.toLowerCase().includes(qq)).map(x =>
      `<label><input type="checkbox" value="${h(x)}"${picked.has(x) ? ' checked' : ''}>${h(x)}${manual.has(x) ? ' <span class="tag">(manual)</span>' : live && !live.has(x) ? ' <span class="tag">(not in live list)</span>' : ''}</label>`).join('') || '<span class="muted small">No match.</span>';
    $('#pv-count', m).textContent = `${all.filter(x => picked.has(x)).length} of ${all.length} selected`;
    if (!isNew) mountTest($('#pv-test', m), p, all.filter(x => picked.has(x)));
  };
  $('#pv-list', m).onchange = e => {
    const c = e.target; if (!c.matches('input[type=checkbox]')) return;
    touched = true;
    if (c.checked) picked.add(c.value); else picked.delete(c.value);
    paintList();
  };
  q.oninput = paintList;
  const visible = () => $$('#pv-list input', m).map(c => c.value);
  $('#pv-all', m).onclick = () => { touched = true; visible().forEach(x => picked.add(x)); paintList(); };
  $('#pv-none', m).onclick = () => { touched = true; visible().forEach(x => picked.delete(x)); paintList(); };
  const addManual = () => {
    const inp = $('#pv-madd', m);
    inp.value.split(/[\s,]+/).map(s => s.trim()).filter(Boolean).forEach(x => { if (!all.includes(x)) { all.push(x); manual.add(x); } picked.add(x); });
    inp.value = ''; paintList();
  };
  $('#pv-maddb', m).onclick = addManual;
  $('#pv-madd', m).onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); addManual(); } };
  paintList();
  // Live model discovery (does not save anything).
  let seq = 0, timer = null;
  const discover = async () => {
    clearTimeout(timer);
    const base = urlIn.value.trim();
    if (!base) { setStatus('Enter the base URL first.', 'err'); return; }
    const my = ++seq;
    setStatus('Loading models…');
    const btn = $('#pv-load', m); btn.disabled = true;
    try {
      const body = { type: typeSel.value, base_url: base, api_key: keyIn.value.trim(), api_key_env: envIn.value.trim(), headers: readHeaders() };
      if (!isNew) body.id = p.id;
      const r = await api('POST', '/api/discover', body);
      if (my !== seq || !m.isConnected) return;
      const found = Array.from(new Set((r && r.models) || [])).sort((a, b) => a.localeCompare(b));
      if (!found.length) { setStatus('The provider returned no models. Add one manually below.', 'err'); $('#pv-manual', m).open = true; return; }
      const keep = all.filter(x => manual.has(x) || (!isNew && picked.has(x) && !found.includes(x)));
      if (isNew && !touched) { picked.clear(); found.forEach(x => picked.add(x)); manual.forEach(x => picked.add(x)); }
      all = found.concat(keep.filter(x => !found.includes(x)));
      live = new Set(found);
      for (const x of Array.from(picked)) if (!all.includes(x)) picked.delete(x);
      const fresh = isNew ? 0 : found.filter(x => !(p.models || []).includes(x)).length;
      setStatus(`${found.length} models found` + (fresh ? ` · ${fresh} new (unchecked)` : ''), 'ok');
      paintList();
    } catch (err) {
      if (my !== seq || !m.isConnected) return;
      setStatus(err.message || String(err), 'err');
      $('#pv-manual', m).open = true;
    } finally { if (my === seq) btn.disabled = false; }
  };
  const soon = () => {
    clearTimeout(timer);
    if (!urlIn.value.trim()) return;
    if (!keyIn.value.trim() && !envIn.value.trim() && !p.has_api_key) return;
    timer = setTimeout(discover, 600);
  };
  $('#pv-load', m).onclick = discover;
  urlIn.oninput = () => { syncType(); soon(); };
  typeSel.onchange = () => { syncType(); soon(); };
  keyIn.oninput = soon; envIn.oninput = soon;
  hdrs.onclick = e => { const b = e.target.closest('[data-rm]'); if (b) b.parentElement.remove(); };
  $('#pv-hadd', m).onclick = () => { hdrs.insertAdjacentHTML('beforeend', hdrRow('', '')); $$('.hk', hdrs).pop().focus(); };
  if (!isNew && p.base_url) discover();
  else if (isNew && p.base_url) setStatus('Paste your key, the model list loads by itself.');
  $('#pv-save', m).onclick = e => run(async () => {
    const name = nameIn.value.trim();
    if (!name) throw new Error('Please enter a name');
    const id = curId();
    const base = urlIn.value.trim();
    if (!base) throw new Error('Base URL is required');
    const models = all.filter(x => picked.has(x));
    if (all.length && !models.length) throw new Error('Pick at least one model');
    const key = keyIn.value.trim();
    const body = Object.assign({}, p, {
      id, name, type: typeSel.value, base_url: base,
      api_key: key || (isNew ? '' : p.api_key || ''), api_key_env: envIn.value.trim(),
      headers: readHeaders(), models, max_tokens_field: typeSel.value === 'openai' ? $('#pv-mtf', m).value : '',
      enabled: $('#pv-en', m).checked
    });
    delete body.has_api_key;
    const saved = await api('PUT', '/api/providers/' + enc(id) + (isNew ? '?create=1' : ''), body);
    await loadProviders();
    closeModal();
    const n = ((saved && saved.models) || models).length;
    toast(`Provider saved · ${n} models`, 'ok');
    if (curTab() === 'providers') await views.providers($('#view'), () => true);
  }, e.target);
  const del = $('#pv-del', m);
  if (del) del.onclick = e => run(async () => {
    if (!confirm(`Delete provider "${p.name || p.id}"?`)) return;
    await api('DELETE', '/api/providers/' + enc(p.id));
    closeModal(); toast('Provider deleted', 'ok'); render();
  }, e.target);
}

/* ---------- rules ---------- */
let rulesDraft = [];
const CUSTOM = '__custom__';
views.rules = async (v, alive) => {
  await Promise.all([loadProviders(), loadRules(), loadMeta()]);
  if (!alive()) return;
  rulesDraft = clone(state.rules) || [];
  v.innerHTML = `<div class="bar"><h2>Rules</h2><div class="grow"></div>
    <button class="btn" id="addRule">+ Add rule</button><button class="btn primary" id="saveRules">Save all</button></div>
    <p class="hint">For requests that are not from a routed agent. Pick which requests, then where they run. First match wins. No match = your subscription.</p>
    <div id="rulelist"></div>`;
  paintRules();
  $('#addRule').onclick = () => {
    syncRules();
    const pats = state.meta.rule_patterns;
    rulesDraft.push({ match: pats.length ? pats[0].match : '', enabled: true, note: '', route: Object.assign({}, ROUTE_DEFAULT) });
    paintRules();
    const sels = $$('#rulelist .r-msel'); if (sels.length) sels[sels.length - 1].focus();
  };
  $('#saveRules').onclick = e => run(async () => {
    syncRules();
    rulesDraft.forEach((r, i) => { if (!r.match) throw new Error(`Rule #${i + 1} needs a pattern`); });
    state.rules = (await api('PUT', '/api/rules', rulesDraft)) || rulesDraft;
    rulesDraft = clone(state.rules);
    paintRules();
    toast('Rules saved', 'ok');
  }, e.target);
};
function syncRules() {
  $$('#rulelist .rule').forEach(card => {
    const r = rulesDraft[Number(card.dataset.i)];
    if (!r) return;
    const sv = $('.r-msel', card).value;
    r.match = sv === CUSTOM ? $('.r-match', card).value.trim() : sv;
    r.enabled = $('.r-en', card).checked;
    r.note = $('.r-note', card).value;
    r.route = $('.r-route', card)._get();
  });
}
function paintRules() {
  const box = $('#rulelist'); if (!box) return;
  if (!rulesDraft.length) { box.innerHTML = '<div class="empty">No rules: everything not from a routed agent uses your subscription.</div>'; return; }
  const pats = (state.meta || META_DEFAULT).rule_patterns;
  box.innerHTML = rulesDraft.map((r, i) => {
    const known = pats.some(p => p.match === r.match);
    return `<div class="card rule" data-i="${i}">
    <div class="rule-head"><span class="num">#${i + 1}</span>
      <label class="switch" title="Enabled"><input type="checkbox" class="r-en"${r.enabled ? ' checked' : ''}><span></span></label>
      <select class="r-msel r-match-sel" style="flex:1;min-width:170px">${pats.map(p => `<option value="${h(p.match)}"${p.match === r.match ? ' selected' : ''}>${h(p.label)}</option>`).join('')}
        <option value="${h(CUSTOM)}"${known ? '' : ' selected'}>Custom pattern…</option></select>
      <button class="btn icon" data-act="up" title="Move up"${i === 0 ? ' disabled' : ''}>↑</button>
      <button class="btn icon" data-act="down" title="Move down"${i === rulesDraft.length - 1 ? ' disabled' : ''}>↓</button>
      <button class="btn icon danger" data-act="del" title="Delete">✕</button></div>
    <label class="f r-cw"${known ? ' style="display:none"' : ''}><input class="r-match mono" value="${h(known ? '' : r.match)}" placeholder="claude-*-latest" spellcheck="false">
      <small>Glob on the requested model name. <code>*</code> = anything.</small></label>
    <label class="f"><input class="r-note" value="${h(r.note)}" placeholder="Note (optional)"></label>
    <div class="r-route"></div></div>`;
  }).join('');
  $$('.rule', box).forEach(card => {
    mountRoute($('.r-route', card), rulesDraft[Number(card.dataset.i)].route);
    const sel = $('.r-msel', card);
    sel.onchange = () => {
      const c = sel.value === CUSTOM;
      $('.r-cw', card).style.display = c ? '' : 'none';
      if (c) $('.r-match', card).focus();
    };
  });
  box.onclick = e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const i = Number(b.closest('.rule').dataset.i);
    syncRules();
    if (b.dataset.act === 'up' && i > 0) rulesDraft.splice(i - 1, 0, rulesDraft.splice(i, 1)[0]);
    else if (b.dataset.act === 'down' && i < rulesDraft.length - 1) rulesDraft.splice(i + 1, 0, rulesDraft.splice(i, 1)[0]);
    else if (b.dataset.act === 'del') { if (!confirm(`Delete rule #${i + 1}?`)) return; rulesDraft.splice(i, 1); }
    paintRules();
  };
}

/* ---------- settings ---------- */
views.settings = async (v, alive) => {
  const s = await api('GET', '/api/settings');
  if (!alive()) return;
  const fld = (k, label, hint, attrs) => `<label class="f"><span>${label}</span><input id="st-${k}" class="mono" value="${h(s[k])}" spellcheck="false" ${attrs || ''}>${hint ? `<small>${hint}</small>` : ''}</label>`;
  v.innerHTML = `<div class="bar"><h2>Settings</h2><div class="grow"></div><button class="btn primary" id="saveSet">Save</button></div>
    <div id="st-note"></div>
    <div class="panel">
      <div class="grid2">
        ${fld('proxy_listen', 'Proxy listen', 'Address Claude Code connects to. Restart needed.')}
        ${fld('panel_listen', 'Panel listen', 'Address of this panel. Restart needed.')}
      </div>
      <div class="grid2">
        ${fld('upstream', 'Anthropic upstream', 'Where pass-through requests go.')}
        ${fld('header_timeout', 'Header timeout (seconds)', 'How long to wait for response headers.', 'type="number" min="0" step="1"')}
      </div>
      <div class="grid2">
        ${fld('agents_dir', 'Agents directory', 'Folder with agent .md files.')}
        ${fld('log_file', 'Log file', 'Empty = no log file.')}
      </div>
      <label class="f"><span>Panel token</span><input id="st-tok" type="password" autocomplete="new-password" placeholder="${h(s.panel_token ? s.panel_token : 'not set')}">
        <small>${s.panel_token ? 'A token is set. Leave blank to keep it.' : 'Optional. Protects this panel.'}</small></label>
    </div>`;
  $('#saveSet').onclick = e => run(async () => {
    const body = Object.assign({}, s);
    ['proxy_listen', 'panel_listen', 'upstream', 'agents_dir', 'log_file'].forEach(k => (body[k] = $('#st-' + k).value.trim()));
    body.header_timeout = Math.max(0, parseInt($('#st-header_timeout').value, 10) || 0);
    const tok = $('#st-tok').value.trim();
    body.panel_token = tok || s.panel_token || '';
    const r = await api('PUT', '/api/settings', body);
    if (tok) store.set('chr_token', tok);
    if (r && r.settings) Object.assign(s, r.settings);
    $('#st-tok').value = '';
    $('#st-note').innerHTML = r && r.restart_required ? '<div class="note warn">Saved. Restart claude-hybrid to apply the new listen address.</div>' : '';
    toast('Settings saved', 'ok');
  }, e.target);
};

/* ---------- raw config ---------- */
views.raw = async (v, alive) => {
  const r = await api('GET', '/api/config/raw');
  if (!alive()) return;
  v.innerHTML = `<div class="bar"><h2>Raw config</h2><div class="grow"></div>
    <button class="btn" id="rawReload" title="Re-read config and agents from disk">Reload</button><button class="btn primary" id="rawSave">Save</button></div>
    <div class="note warn">API keys are shown masked. Masked values are kept as they are when you save. Invalid YAML is rejected.</div>
    <textarea id="rawText" class="yaml" spellcheck="false"></textarea>`;
  const ta = $('#rawText');
  ta.value = (r && r.yaml) || '';
  ta.onkeydown = e => {
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); ta.setRangeText('  ', ta.selectionStart, ta.selectionEnd, 'end'); }
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); $('#rawSave').click(); }
  };
  $('#rawSave').onclick = e => run(async () => {
    await api('PUT', '/api/config/raw', { yaml: ta.value });
    toast('Config saved', 'ok');
  }, e.target);
  $('#rawReload').onclick = e => run(async () => {
    await api('POST', '/api/reload');
    const r2 = await api('GET', '/api/config/raw');
    ta.value = (r2 && r2.yaml) || '';
    toast('Reloaded from disk', 'ok');
  }, e.target);
};

/* ---------- header actions + theme ---------- */
function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
applyTheme(store.get('chr_theme'));
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') ||
    (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next); store.set('chr_theme', next);
};
$('#reloadBtn').onclick = e => run(async () => {
  if ($('#modal-root').firstChild && !confirm('Reload from disk? Unsaved changes in the open editor will be lost.')) return;
  await api('POST', '/api/reload');
  toast('Reloaded config and agents', 'ok');
  render();
}, e.currentTarget);

loadStatus().catch(() => {});
Promise.all([loadMeta(), loadProviders(), loadAgents()]).catch(() => {}).finally(render);
</script>
</body>
